<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AMBULATORI GVM</title>

    <link rel="icon" href="data:,">

    <style>

        /* =========================================================
           AMBULATORI GVM
           CLINICAL / MEDICAL UI
           Vetëm DESIGN - nuk prek logjikën e aplikacionit
        ========================================================= */

        :root {
            --medical-blue: #087ea4;
            --medical-blue-dark: #075b78;
            --medical-blue-light: #e9f7fb;

            --clinical-green: #19a974;
            --clinical-green-light: #e9f8f2;

            --clinical-orange: #e7a42b;
            --clinical-orange-light: #fff6df;

            --clinical-red: #d9535f;
            --clinical-red-light: #fff0f1;

            --text-main: #183b4d;
            --text-soft: #6c8490;

            --background: #f3f7f9;
            --white: #ffffff;

            --border: #dce8ed;

            --shadow-small:
                0 2px 8px rgba(20, 67, 86, 0.06);

            --shadow:
                0 8px 25px rgba(20, 67, 86, 0.08);

            --shadow-large:
                0 15px 45px rgba(20, 67, 86, 0.12);

            --radius: 16px;
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text-main);

            background:
                radial-gradient(
                    circle at 0% 0%,
                    rgba(8,126,164,.08),
                    transparent 28%
                ),
                #f3f7f9;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =========================================================
           LOADING
        ========================================================= */

        .loading {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 18px;

            color: var(--medical-blue);

            font-size: 17px;
            font-weight: 700;
        }

        .loading::before {
            content: "✚";

            width: 72px;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    var(--medical-blue),
                    #26a7ca
                );

            color: white;

            font-size: 36px;
            font-weight: 900;

            box-shadow:
                0 14px 30px rgba(8,126,164,.22);
        }


        /* =========================================================
           LOGIN - KLINIK
        ========================================================= */

        .login-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background:
                linear-gradient(
                    135deg,
                    #eef9fc 0%,
                    #f8fbfc 45%,
                    #eaf4f7 100%
                );
        }

        .login-page::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(8,126,164,.05);

            top: -220px;
            left: -200px;
        }

        .login-page::after {
            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background: rgba(25,169,116,.045);

            bottom: -220px;
            right: -180px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;

            position: relative;
            z-index: 2;

            background: white;

            border:
                1px solid rgba(220,232,237,.9);

            border-radius: 26px;

            padding: 42px;

            box-shadow: var(--shadow-large);
        }

        .medical-logo {
            width: 84px;
            height: 84px;

            margin: 0 auto 20px;

            border-radius: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    var(--medical-blue-dark),
                    var(--medical-blue)
                );

            color: white;

            font-size: 43px;
            font-weight: 900;

            box-shadow:
                0 14px 30px rgba(8,126,164,.24);
        }

        .login-card h1 {
            text-align: center;

            font-size: 27px;

            color: var(--medical-blue-dark);

            letter-spacing: -.4px;

            margin-bottom: 7px;
        }

        .login-subtitle {
            text-align: center;

            color: var(--text-soft);

            font-size: 14px;

            margin-bottom: 31px;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 800;

            color: #345868;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;

            border:
                1px solid var(--border);

            border-radius: 12px;

            padding: 13px 14px;

            outline: none;

            color: var(--text-main);

            background: #fbfdfe;

            transition:
                border-color .2s,
                box-shadow .2s,
                background .2s;
        }

        .form-group input:hover,
        .form-group select:hover,
        .form-group textarea:hover {
            border-color: #b9d4df;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            background: white;

            border-color: var(--medical-blue);

            box-shadow:
                0 0 0 4px rgba(8,126,164,.09);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .login-button,
        .add-button {

            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 14px 18px;

            color: white;

            font-size: 15px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    var(--medical-blue-dark),
                    var(--medical-blue)
                );

            box-shadow:
                0 8px 20px rgba(8,126,164,.18);

            transition:
                transform .15s,
                box-shadow .15s;
        }

        .login-button:hover,
        .add-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 11px 25px rgba(8,126,164,.24);
        }


        /* =========================================================
           APP
        ========================================================= */

        .app-shell {
            min-height: 100vh;

            background:
                #f3f7f9;
        }


        /* =========================================================
           TOP BAR
        ========================================================= */

        .topbar {

            height: 78px;

            position: sticky;
            top: 0;

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                0 30px;

            background:
                rgba(255,255,255,.96);

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid var(--border);

            box-shadow:
                0 3px 15px rgba(20,67,86,.05);
        }


        /* =========================================================
           BRAND
        ========================================================= */

        .brand {

            display: flex;
            align-items: center;

            gap: 13px;
        }

        .brand-icon {

            width: 48px;
            height: 48px;

            flex: 0 0 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    var(--medical-blue-dark),
                    #159bc3
                );

            color: white;

            font-size: 27px;
            font-weight: 900;

            box-shadow:
                0 8px 18px rgba(8,126,164,.20);
        }

        .brand-title {

            font-size: 20px;

            font-weight: 900;

            color:
                var(--medical-blue-dark);

            letter-spacing: -.3px;
        }

        .brand-subtitle {

            margin-top: 2px;

            color: #8096a0;

            font-size: 11px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: .8px;
        }


        /* =========================================================
           USER
        ========================================================= */

        .user-area {

            display: flex;
            align-items: center;

            gap: 13px;
        }

        .user-info {

            display: flex;
            align-items: center;

            gap: 9px;

            color: #58727e;

            font-size: 13px;
            font-weight: 600;
        }

        .user-avatar {

            width: 38px;
            height: 38px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                var(--medical-blue-light);

            color:
                var(--medical-blue);

            font-weight: 900;
        }

        .logout-button {

            border:
                1px solid #dce7ec;

            border-radius: 10px;

            background: white;

            color: #637c87;

            padding:
                9px 13px;

            font-size: 13px;
            font-weight: 700;

            transition: .15s;
        }

        .logout-button:hover {

            background:
                var(--clinical-red-light);

            border-color:
                #f0c9cd;

            color:
                var(--clinical-red);
        }


        /* =========================================================
           MAIN CONTAINER
        ========================================================= */

        .main-container {

            width: 100%;
            max-width: 1480px;

            margin: 0 auto;

            padding:
                28px 30px 50px;
        }


        /* =========================================================
           WELCOME / CLINIC HEADER
        ========================================================= */

        .welcome-card {

            position: relative;

            overflow: hidden;

            min-height: 150px;

            margin-bottom: 22px;

            padding:
                27px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-radius: 21px;

            color: white;

            background:
                linear-gradient(
                    120deg,
                    #075b78 0%,
                    #087ea4 48%,
                    #20a3c7 100%
                );

            box-shadow:
                0 14px 32px rgba(8,126,164,.17);
        }

        .welcome-card::after {

            content: "✚";

            position: absolute;

            right: 90px;
            bottom: -45px;

            font-size: 180px;

            line-height: 1;

            opacity: .06;

            font-weight: 900;
        }

        .welcome-card h2 {

            font-size: 25px;

            margin-bottom: 7px;

            font-weight: 800;
        }

        .welcome-card p {

            color: rgba(255,255,255,.82);

            font-size: 14px;
        }

        .doctor-icon {

            position: relative;
            z-index: 2;

            width: 78px;
            height: 78px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(255,255,255,.13);

            border:
                1px solid rgba(255,255,255,.20);

            font-size: 42px;
        }


        /* =========================================================
           DATE / CALENDAR BAR
        ========================================================= */

        .date-card {

            min-height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 22px;

            padding:
                13px 17px;

            background: white;

            border:
                1px solid var(--border);

            border-radius: 16px;

            box-shadow: var(--shadow-small);
        }

        .date-navigation {

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .date-button {

            width: 40px;
            height: 40px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background:
                #f8fbfc;

            color:
                var(--medical-blue);

            font-size: 19px;

            font-weight: 900;
        }

        .date-button:hover {
            background:
                var(--medical-blue-light);

            border-color:
                #bcdce7;
        }

        .today-button {

            padding:
                10px 14px;

            border:
                none;

            border-radius: 10px;

            background:
                var(--medical-blue-light);

            color:
                var(--medical-blue-dark);

            font-size: 13px;

            font-weight: 800;
        }

        .today-button:hover {
            background:
                #d9f0f7;
        }

        .current-date {
            text-align: center;
        }

        .current-date strong {

            display: block;

            color:
                var(--medical-blue-dark);

            font-size: 19px;

            font-weight: 900;
        }

        .current-date span {

            display: block;

            margin-top: 3px;

            color:
                var(--text-soft);

            font-size: 12px;
        }


        /* =========================================================
           DASHBOARD
        ========================================================= */

        .dashboard-grid {

            display: grid;

            grid-template-columns:
                360px minmax(0, 1fr);

            gap: 22px;

            align-items: start;
        }


        /* =========================================================
           PANELS
        ========================================================= */

        .panel {

            overflow: hidden;

            background:
                white;

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            box-shadow:
                var(--shadow-small);
        }

        .panel-header {

            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                14px 19px;

            border-bottom:
                1px solid #e8eff2;

            background:
                linear-gradient(
                    to bottom,
                    #ffffff,
                    #fbfdfe
                );
        }

        .panel-title {

            display: flex;
            align-items: center;

            gap: 10px;

            color:
                var(--medical-blue-dark);

            font-size: 16px;

            font-weight: 900;
        }

        .panel-title-icon {

            width: 36px;
            height: 36px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                var(--medical-blue-light);

            color:
                var(--medical-blue);

            font-size: 17px;

            font-weight: 900;
        }

        .panel-body {
            padding: 20px;
        }


        /* =========================================================
           PATIENT FORM - MEDICAL RECORD LOOK
        ========================================================= */

        .appointment-form {

            position: relative;
        }

        .appointment-form::before {

            content: "INFORMACION E PACIENTIT";

            display: block;

            margin-bottom: 16px;

            padding-bottom: 9px;

            border-bottom:
                1px solid #edf2f4;

            color:
                #81959e;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 1.1px;
        }

        .appointment-form .form-group {

            position: relative;
        }

        .appointment-form .form-group label {

            color:
                #486673;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: .3px;
        }

        .appointment-form input,
        .appointment-form select,
        .appointment-form textarea {

            background:
                #fafdfe;
        }


        /* =========================================================
           SCHEDULE
        ========================================================= */

        .schedule-header {

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .schedule-count {

            min-width: 30px;

            padding:
                5px 9px;

            border-radius: 20px;

            text-align: center;

            background:
                var(--medical-blue-light);

            color:
                var(--medical-blue);

            font-size: 11px;

            font-weight: 900;
        }

        .schedule-list {

            padding:
                7px 12px 15px;
        }


        /* =========================================================
           APPOINTMENT ROW
        ========================================================= */

        .appointment-row {

            position: relative;

            display: grid;

            grid-template-columns:
                85px minmax(0, 1fr) auto;

            gap: 16px;

            align-items: center;

            min-height: 72px;

            padding:
                12px 11px;

            border-bottom:
                1px solid #edf2f4;

            transition:
                background .15s,
                transform .15s;
        }

        .appointment-row:last-child {
            border-bottom: none;
        }

        .appointment-row:hover {

            background:
                #f7fbfc;

            border-radius: 11px;

            transform:
                translateX(2px);
        }


        /* =========================================================
           TIME
        ========================================================= */

        .appointment-time {

            position: relative;

            color:
                var(--medical-blue-dark);

            font-size: 15px;

            font-weight: 900;
        }

        .appointment-time::before {

            content: "";

            display: inline-block;

            width: 7px;
            height: 7px;

            margin-right: 7px;

            border-radius: 50%;

            background:
                var(--medical-blue);
        }


        /* =========================================================
           PATIENT CARD
        ========================================================= */

        .patient-info {

            min-width: 0;

            padding:
                3px 0;
        }

        .patient-name {

            color:
                #244b5c;

            font-size: 15px;

            font-weight: 900;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .patient-phone {

            margin-top: 3px;

            color:
                #8498a1;

            font-size: 11px;

            font-weight: 600;
        }

        .patient-note {

            margin-top: 4px;

            color:
                #718791;

            font-size: 11px;
        }


        /* =========================================================
           STATUS BUTTONS
        ========================================================= */

        .appointment-actions {

            display: flex;
            align-items: center;

            justify-content: flex-end;

            gap: 6px;

            flex-wrap: wrap;
        }

        .status-button {

            border: none;

            border-radius: 8px;

            padding:
                7px 10px;

            font-size: 11px;

            font-weight: 900;

            transition: .15s;
        }

        .status-button:hover {
            transform: translateY(-1px);
        }

        .status-planned {

            background:
                var(--medical-blue-light);

            color:
                var(--medical-blue-dark);
        }

        .status-arrived {

            background:
                var(--clinical-orange-light);

            color:
                #9b6808;
        }

        .status-finished {

            background:
                var(--clinical-green-light);

            color:
                #18764f;
        }

        .status-cancelled {

            background:
                var(--clinical-red-light);

            color:
                #b23f49;
        }


        /* =========================================================
           DELETE
        ========================================================= */

        .delete-button {

            width: 31px;
            height: 31px;

            border:
                1px solid #eedbde;

            border-radius: 8px;

            background:
                #fffafa;

            color:
                var(--clinical-red);

            font-size: 13px;

            font-weight: 900;
        }

        .delete-button:hover {

            background:
                var(--clinical-red-light);

            border-color:
                #eabcc1;
        }


        /* =========================================================
           EMPTY STATE
        ========================================================= */

        .empty-state {

            padding:
                55px 25px;

            text-align: center;

            color:
                #91a3aa;
        }

        .empty-icon {

            width: 66px;
            height: 66px;

            margin:
                0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                #eef7fa;

            color:
                #65a4b9;

            font-size: 29px;

            opacity: .9;
        }

        .empty-state strong {

            display: block;

            margin-bottom: 5px;

            color:
                #607b87;

            font-size: 14px;
        }

        .empty-state span {

            font-size: 12px;
        }


        /* =========================================================
           MESSAGES
        ========================================================= */

        .message {

            margin-bottom:
                17px;

            padding:
                12px 15px;

            border-radius:
                11px;

            font-size:
                13px;

            font-weight:
                700;
        }

        .message.success {

            color:
                #18764f;

            background:
                var(--clinical-green-light);

            border:
                1px solid #cdebdc;
        }

        .message.error {

            color:
                #b23f49;

            background:
                var(--clinical-red-light);

            border:
                1px solid #efd0d4;
        }


        /* =========================================================
           FATAL ERROR
        ========================================================= */

        .fatal-error {

            max-width:
                650px;

            margin:
                80px auto;

            padding:
                30px;

            background:
                white;

            border:
                1px solid #efd0d4;

            border-radius:
                18px;

            color:
                #a33d45;

            box-shadow:
                var(--shadow);
        }

        .fatal-error h2 {
            margin-bottom: 10px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 1050px) {

            .dashboard-grid {

                grid-template-columns:
                    320px minmax(0,1fr);
            }

            .appointment-row {

                grid-template-columns:
                    75px minmax(0,1fr);
            }

            .appointment-actions {

                grid-column:
                    2;
            }
        }


        @media (max-width: 850px) {

            .dashboard-grid {

                grid-template-columns:
                    1fr;
            }

            .main-container {

                padding:
                    20px;
            }
        }


        @media (max-width: 650px) {

            .topbar {

                height: auto;

                padding:
                    12px 15px;

                gap: 12px;
            }

            .brand-icon {

                width: 42px;
                height: 42px;
            }

            .brand-title {

                font-size:
                    16px;
            }

            .brand-subtitle {

                display:
                    none;
            }

            .user-info span {

                display:
                    none;
            }

            .logout-button {

                padding:
                    8px 10px;

                font-size:
                    11px;
            }

            .main-container {

                padding:
                    15px 11px 30px;
            }

            .welcome-card {

                min-height:
                    125px;

                padding:
                    20px;

                border-radius:
                    17px;
            }

            .welcome-card h2 {

                font-size:
                    19px;
            }

            .welcome-card p {

                font-size:
                    12px;
            }

            .doctor-icon {

                width:
                    55px;

                height:
                    55px;

                border-radius:
                    16px;

                font-size:
                    30px;
            }

            .date-card {

                flex-direction:
                    column;

                padding:
                    13px;
            }

            .date-navigation {

                width:
                    100%;

                justify-content:
                    center;
            }

            .current-date strong {

                font-size:
                    17px;
            }

            .panel {

                border-radius:
                    14px;
            }

            .panel-header {

                padding:
                    13px 15px;
            }

            .panel-body {

                padding:
                    15px;
            }

            .appointment-row {

                grid-template-columns:
                    68px minmax(0,1fr);

                gap:
                    9px;

                padding:
                    13px 7px;
            }

            .appointment-actions {

                grid-column:
                    1 / -1;

                justify-content:
                    flex-start;

                padding-top:
                    2px;
            }

            .login-card {

                padding:
                    30px 22px;

                border-radius:
                    21px;
            }
        }
