<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMBULATORI GVM | Hospital System</title>

<link rel="icon" href="data:,">

<style>

/* =========================================================
   AMBULATORI GVM
   HOSPITAL MANAGEMENT SYSTEM
========================================================= */

:root{
    --hospital-blue:#0c6f91;
    --hospital-dark:#123f55;
    --hospital-teal:#18a1b8;
    --hospital-light:#eaf7fa;

    --green:#24a879;
    --orange:#e7a83b;
    --red:#d75d68;

    --background:#eef4f7;
    --white:#ffffff;

    --text:#173b4c;
    --muted:#78909c;

    --border:#dce7ec;

    --shadow:
        0 8px 28px rgba(24,64,82,.08);
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    color:var(--text);

    background:
        linear-gradient(
            rgba(238,244,247,.91),
            rgba(238,244,247,.96)
        ),
        radial-gradient(
            circle at 10% 10%,
            rgba(24,161,184,.15),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(12,111,145,.10),
            transparent 30%
        );

    min-height:100vh;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================================================
   HOSPITAL BACKGROUND
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    z-index:-2;

    opacity:.25;

    background-image:

        linear-gradient(
            90deg,
            transparent 49%,
            rgba(12,111,145,.04) 50%,
            transparent 51%
        ),

        linear-gradient(
            0deg,
            transparent 49%,
            rgba(12,111,145,.035) 50%,
            transparent 51%
        );

    background-size:
        90px 90px;

    pointer-events:none;
}

body::after{

    content:"✚";

    position:fixed;

    right:-80px;
    bottom:-110px;

    z-index:-1;

    font-size:520px;

    line-height:1;

    color:rgba(12,111,145,.025);

    font-weight:900;

    pointer-events:none;
}


/* =========================================================
   LOADING
========================================================= */

.loading{

    min-height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    color:var(--hospital-blue);

    font-weight:700;
}

.loading::before{

    content:"✚";

    width:76px;
    height:76px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:18px;

    border-radius:24px;

    color:white;

    font-size:38px;

    background:
        linear-gradient(
            135deg,
            var(--hospital-dark),
            var(--hospital-teal)
        );

    box-shadow:
        0 18px 35px rgba(12,111,145,.22);
}


/* =========================================================
   LOGIN
========================================================= */

.login-page{

    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:30px;

    background:

        linear-gradient(
            rgba(235,246,249,.91),
            rgba(245,249,251,.95)
        ),

        radial-gradient(
            circle at 20% 30%,
            rgba(24,161,184,.20),
            transparent 35%
        );
}

.login-card{

    width:100%;
    max-width:430px;

    background:white;

    padding:42px;

    border-radius:28px;

    border:
        1px solid var(--border);

    box-shadow:
        0 25px 70px rgba(20,65,85,.14);
}

.medical-logo{

    width:86px;
    height:86px;

    margin:
        0 auto 20px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:25px;

    color:white;

    font-size:43px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            var(--hospital-dark),
            var(--hospital-teal)
        );

    box-shadow:
        0 15px 32px rgba(12,111,145,.22);
}

.login-card h1{

    text-align:center;

    color:var(--hospital-dark);

    font-size:27px;

    margin-bottom:7px;
}

.login-subtitle{

    text-align:center;

    color:var(--muted);

    font-size:14px;

    margin-bottom:30px;
}


/* =========================================================
   FORM
========================================================= */

.form-group{

    margin-bottom:17px;
}

.form-group label{

    display:block;

    margin-bottom:7px;

    color:#486572;

    font-size:12px;

    font-weight:800;

    text-transform:uppercase;
}

.form-group input,
.form-group select,
.form-group textarea{

    width:100%;

    padding:13px 14px;

    border:
        1px solid var(--border);

    border-radius:11px;

    outline:none;

    background:#fbfdfe;

    color:var(--text);

    transition:.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{

    border-color:
        var(--hospital-teal);

    background:white;

    box-shadow:
        0 0 0 4px rgba(24,161,184,.09);
}

.form-group textarea{

    min-height:90px;

    resize:vertical;
}


/* =========================================================
   BUTTON
========================================================= */

.login-button,
.add-button{

    width:100%;

    border:0;

    border-radius:11px;

    padding:14px;

    color:white;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            var(--hospital-dark),
            var(--hospital-blue)
        );

    box-shadow:
        0 10px 22px rgba(12,111,145,.18);

    transition:.2s;
}

.login-button:hover,
.add-button:hover{

    transform:translateY(-1px);

    box-shadow:
        0 14px 28px rgba(12,111,145,.25);
}


/* =========================================================
   APP
========================================================= */

.app-shell{

    min-height:100vh;

    display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    width:250px;

    min-height:100vh;

    position:fixed;

    left:0;
    top:0;
    bottom:0;

    z-index:100;

    display:flex;

    flex-direction:column;

    color:white;

    background:
        linear-gradient(
            180deg,
            #123f55 0%,
            #0b3347 100%
        );

    box-shadow:
        8px 0 35px rgba(14,54,72,.10);
}

.sidebar-brand{

    height:82px;

    padding:
        0 22px;

    display:flex;

    align-items:center;

    gap:12px;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.sidebar-logo{

    width:45px;
    height:45px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        rgba(255,255,255,.11);

    font-size:25px;

    font-weight:900;
}

.sidebar-title{

    font-size:16px;

    font-weight:900;
}

.sidebar-subtitle{

    margin-top:3px;

    color:
        rgba(255,255,255,.45);

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:1px;
}


/* =========================================================
   SIDEBAR NAV
========================================================= */

.sidebar-nav{

    padding:23px 13px;

    flex:1;
}

.nav-label{

    padding:
        0 12px 9px;

    color:
        rgba(255,255,255,.40);

    font-size:10px;

    font-weight:800;

    letter-spacing:1.2px;

    text-transform:uppercase;
}

.nav-item{

    display:flex;

    align-items:center;

    gap:12px;

    padding:
        12px 13px;

    margin-bottom:5px;

    border-radius:11px;

    color:
        rgba(255,255,255,.68);

    font-size:13px;

    font-weight:700;
}

.nav-item:hover{

    background:
        rgba(255,255,255,.07);

    color:white;
}

.nav-item.active{

    color:white;

    background:
        rgba(24,161,184,.22);

    box-shadow:
        inset 3px 0 var(--hospital-teal);
}

.nav-icon{

    width:28px;
    height:28px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:
        rgba(255,255,255,.07);
}


/* =========================================================
   SIDEBAR STATUS
========================================================= */

.sidebar-footer{

    padding:16px;

    border-top:
        1px solid rgba(255,255,255,.08);
}

.clinic-status{

    padding:12px;

    border-radius:12px;

    background:
        rgba(255,255,255,.055);

    color:
        rgba(255,255,255,.65);

    font-size:11px;
}

.status-dot{

    width:7px;
    height:7px;

    display:inline-block;

    margin-right:7px;

    border-radius:50%;

    background:#35d18e;

    box-shadow:
        0 0 0 4px rgba(53,209,142,.10);
}


/* =========================================================
   MAIN
========================================================= */

.main-area{

    width:
        calc(100% - 250px);

    margin-left:250px;

    min-height:100vh;
}


/* =========================================================
   HEADER
========================================================= */

.topbar{

    height:82px;

    position:sticky;

    top:0;

    z-index:80;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 30px;

    background:
        rgba(255,255,255,.96);

    backdrop-filter:
        blur(12px);

    border-bottom:
        1px solid var(--border);

    box-shadow:
        0 4px 15px rgba(20,60,80,.04);
}

.page-heading{

    display:flex;

    align-items:center;

    gap:12px;
}

.page-heading-icon{

    width:41px;
    height:41px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:
        var(--hospital-light);

    color:
        var(--hospital-blue);

    font-size:19px;
}

.page-heading h2{

    color:var(--hospital-dark);

    font-size:18px;

    font-weight:900;
}

.page-heading p{

    margin-top:2px;

    color:var(--muted);

    font-size:11px;
}

.user-area{

    display:flex;

    align-items:center;

    gap:12px;
}

.user-info{

    display:flex;

    align-items:center;

    gap:9px;

    color:#607983;

    font-size:12px;

    font-weight:700;
}

.user-avatar{

    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        var(--hospital-light);

    color:
        var(--hospital-blue);

    font-weight:900;
}

.logout-button{

    padding:
        9px 12px;

    border:
        1px solid var(--border);

    border-radius:9px;

    background:white;

    color:#687f89;

    font-size:12px;

    font-weight:800;
}

.logout-button:hover{

    color:var(--red);

    background:#fff1f2;

    border-color:#f0d0d3;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.main-container{

    max-width:1550px;

    margin:auto;

    padding:
        27px 30px 50px;
}


/* =========================================================
   HOSPITAL BANNER
========================================================= */

.welcome-card{

    min-height:150px;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        28px 30px;

    margin-bottom:22px;

    border-radius:20px;

    color:white;

    background:

        linear-gradient(
            120deg,
            rgba(12,74,98,.98),
            rgba(12,126,151,.96),
            rgba(25,169,183,.94)
        );

    box-shadow:
        0 15px 38px rgba(12,111,145,.18);
}

.welcome-card::before{

    content:"";

    position:absolute;

    width:280px;
    height:280px;

    right:100px;
    top:-160px;

    border-radius:50%;

    border:
        40px solid rgba(255,255,255,.035);
}

.welcome-card::after{

    content:"✚";

    position:absolute;

    right:35px;
    bottom:-70px;

    font-size:200px;

    color:white;

    opacity:.045;
}

.welcome-card h2{

    position:relative;

    z-index:2;

    font-size:25px;

    font-weight:900;

    margin-bottom:6px;
}

.welcome-card p{

    position:relative;

    z-index:2;

    color:
        rgba(255,255,255,.78);

    font-size:13px;
}

.doctor-icon{

    position:relative;

    z-index:2;

    width:78px;
    height:78px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:
        rgba(255,255,255,.11);

    border:
        1px solid rgba(255,255,255,.15);

    font-size:40px;
}


/* =========================================================
   DATE BAR
========================================================= */

.date-card{

    min-height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:22px;

    padding:
        12px 16px;

    background:white;

    border:
        1px solid var(--border);

    border-radius:15px;

    box-shadow:var(--shadow);
}

.date-navigation{

    display:flex;

    align-items:center;

    gap:7px;
}

.date-button{

    width:39px;
    height:39px;

    border:
        1px solid var(--border);

    border-radius:9px;

    background:#fbfdfe;

    color:var(--hospital-blue);

    font-size:18px;

    font-weight:900;
}

.date-button:hover{

    background:
        var(--hospital-light);
}

.today-button{

    padding:
        9px 13px;

    border:0;

    border-radius:9px;

    background:
        var(--hospital-light);

    color:
        var(--hospital-dark);

    font-size:12px;

    font-weight:900;
}

.current-date{

    text-align:center;
}

.current-date strong{

    display:block;

    color:
        var(--hospital-dark);

    font-size:18px;

    font-weight:900;
}

.current-date span{

    display:block;

    margin-top:3px;

    color:
        var(--muted);

    font-size:11px;
}


/* =========================================================
   DASHBOARD
========================================================= */

.dashboard-grid{

    display:grid;

    grid-template-columns:
        350px minmax(0,1fr);

    gap:22px;

    align-items:start;
}


/* =========================================================
   PANELS
========================================================= */

.panel{

    overflow:hidden;

    background:white;

    border:
        1px solid var(--border);

    border-radius:17px;

    box-shadow:var(--shadow);
}

.panel-header{

    min-height:68px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        13px 18px;

    border-bottom:
        1px solid var(--border);
}

.panel-title{

    display:flex;

    align-items:center;

    gap:10px;

    color:
        var(--hospital-dark);

    font-size:14px;

    font-weight:900;
}

.panel-title-icon{

    width:35px;
    height:35px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:
        var(--hospital-light);

    color:
        var(--hospital-blue);

    font-size:16px;
}

.panel-body{

    padding:19px;
}


/* =========================================================
   FORM
========================================================= */

.appointment-form::before{

    content:"TË DHËNAT E VIZITËS";

    display:block;

    padding-bottom:9px;

    margin-bottom:17px;

    border-bottom:
        1px solid var(--border);

    color:#93a3aa;

    font-size:9px;

    font-weight:900;

    letter-spacing:1.1px;
}


/* =========================================================
   TABLE
========================================================= */

.schedule-table-wrapper{

    width:100%;

    overflow-x:auto;

    padding:
        0 12px 14px;
}

.schedule-table{

    width:100%;

    min-width:700px;

    border-collapse:separate;

    border-spacing:0 6px;
}


/* TABLE HEADER */

.schedule-table thead th{

    padding:
        11px 13px;

    text-align:left;

    color:#7c919a;

    background:#f5f9fa;

    border-top:
        1px solid #e5edf0;

    border-bottom:
        1px solid #e5edf0;

    font-size:10px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:.6px;
}

.schedule-table thead th:first-child{

    border-left:
        1px solid #e5edf0;

    border-radius:
        9px 0 0 9px;
}

.schedule-table thead th:last-child{

    border-right:
        1px solid #e5edf0;

    border-radius:
        0 9px 9px 0;
}


/* TABLE BODY */

.schedule-table tbody tr{

    transition:
        transform .15s,
        box-shadow .15s;
}

.schedule-table tbody tr:hover{

    transform:
        translateY(-1px);

    filter:
        brightness(.995);
}

.schedule-table tbody td{

    padding:
        13px;

    background:white;

    border-top:
        1px solid #e8eff2;

    border-bottom:
        1px solid #e8eff2;

    font-size:12px;

    vertical-align:middle;
}

.schedule-table tbody td:first-child{

    border-left:
        1px solid #e8eff2;

    border-radius:
        10px 0 0 10px;
}

.schedule-table tbody td:last-child{

    border-right:
        1px solid #e8eff2;

    border-radius:
        0 10px 10px 0;
}


/* =========================================================
   TIME CELL
========================================================= */

.table-time{

    color:
        var(--hospital-dark);

    font-size:13px;

    font-weight:900;

    white-space:nowrap;
}

.table-time::before{

    content:"";

    width:7px;
    height:7px;

    display:inline-block;

    margin-right:7px;

    border-radius:50%;

    background:
        var(--hospital-teal);

    vertical-align:middle;
}


/* =========================================================
   PATIENT
========================================================= */

.table-patient{

    display:flex;

    align-items:center;

    gap:10px;
}

.patient-avatar{

    width:36px;
    height:36px;

    flex:0 0 36px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:
        var(--hospital-light);

    color:
        var(--hospital-blue);

    font-size:12px;

    font-weight:900;
}

.table-patient-name{

    color:
        #214a5d;

    font-size:13px;

    font-weight:900;
}

.table-phone{

    margin-top:2px;

    color:
        #8a9ba2;

    font-size:10px;
}


/* =========================================================
   NOTE
========================================================= */

.table-note{

    max-width:220px;

    color:
        #6e838d;

    font-size:11px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   STATUS
========================================================= */

.table-status{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:
        6px 9px;

    border-radius:20px;

    font-size:10px;

    font-weight:900;

    white-space:nowrap;
}

.table-status::before{

    content:"";

    width:6px;
    height:6px;

    border-radius:50%;
}

.status-planned{

    background:#eaf6fa;

    color:#177691;
}

.status-planned::before{
    background:#2299b7;
}

.status-arrived{

    background:#fff4df;

    color:#9b6913;
}

.status-arrived::before{
    background:#e4a52f;
}

.status-finished{

    background:#e9f8f1;

    color:#1c7a57;
}

.status-finished::before{
    background:#27aa78;
}

.status-cancelled{

    background:#fff0f1;

    color:#b84953;
}

.status-cancelled::before{
    background:#d75d68;
}


/* =========================================================
   ACTIONS
========================================================= */

.table-actions{

    display:flex;

    align-items:center;

    gap:5px;
}

.table-actions .status-button{

    padding:
        6px 8px;

    border:0;

    border-radius:7px;

    font-size:9px;

    font-weight:900;
}

.delete-button{

    width:30px;
    height:30px;

    border:
        1px solid #efd8db;

    border-radius:8px;

    background:#fffafa;

    color:var(--red);

    font-weight:900;
}

.delete-button:hover{

    background:#fff0f1;
}


/* =========================================================
   EMPTY TABLE
========================================================= */

.empty-state{

    padding:
        55px 20px;

    text-align:center;

    color:#93a5ad;
}

.empty-icon{

    width:65px;
    height:65px;

    margin:
        0 auto 13px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:
        var(--hospital-light);

    color:
        var(--hospital-teal);

    font-size:28px;
}

.empty-state strong{

    display:block;

    margin-bottom:5px;

    color:#5f7985;

    font-size:13px;
}

.empty-state span{

    font-size:11px;
}


/* =========================================================
   MESSAGES
========================================================= */

.message{

    margin-bottom:16px;

    padding:
        11px 14px;

    border-radius:10px;

    font-size:12px;

    font-weight:700;
}

.message.success{

    color:#1c7755;

    background:#e9f8f1;

    border:1px solid #ccebdc;
}

.message.error{

    color:#b44650;

    background:#fff0f1;

    border:1px solid #efd0d4;
}


/* =========================================================
   ERROR
========================================================= */

.fatal-error{

    max-width:650px;

    margin:80px auto;

    padding:30px;

    background:white;

    border:
        1px solid #efd0d4;

    border-radius:18px;

    color:#a13f48;

    box-shadow:var(--shadow);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1050px){

    .sidebar{
        width:215px;
    }

    .main-area{

        width:
