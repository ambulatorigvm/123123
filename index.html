```html
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMBULATORI GVM</title>

<link rel="icon" href="data:,">

<style>

/* =========================================================
   GVM CLINIC
   MODERN MEDICAL INTERFACE
========================================================= */

:root{
    --navy:#123b52;
    --navy2:#0d2f42;
    --teal:#159bb7;
    --teal2:#21b5c7;

    --blue-soft:#eaf7fa;
    --green:#2aa876;
    --orange:#e8a33a;
    --red:#dc626b;

    --bg:#f5f8fa;
    --card:#ffffff;

    --text:#173b4d;
    --muted:#80939d;

    --border:#e5edf1;

    --shadow:
        0 8px 30px rgba(20,60,80,.07);

    --shadow2:
        0 15px 45px rgba(20,60,80,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    background:var(--bg);
    color:var(--text);

    min-height:100vh;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    color:var(--teal);

    font-weight:700;
}

.loading:before{
    content:"✚";

    width:70px;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:18px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            var(--navy),
            var(--teal)
        );

    color:white;

    font-size:35px;

    box-shadow:
        0 15px 30px rgba(21,155,183,.20);
}


/* =========================================================
   LOGIN
========================================================= */

.login-page{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        linear-gradient(
            135deg,
            #eaf7fa,
            #f7fafb
        );
}

.login-card{

    width:100%;
    max-width:420px;

    background:white;

    padding:42px;

    border-radius:28px;

    box-shadow:var(--shadow2);

    border:1px solid var(--border);
}

.medical-logo{

    width:78px;
    height:78px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            var(--navy),
            var(--teal)
        );

    color:white;

    font-size:40px;
    font-weight:900;

    box-shadow:
        0 15px 30px rgba(21,155,183,.20);
}

.login-card h1{

    text-align:center;

    color:var(--navy);

    font-size:27px;

    margin-bottom:7px;
}

.login-subtitle{

    text-align:center;

    color:var(--muted);

    font-size:14px;

    margin-bottom:30px;
}


/* =========================================================
   FORM
========================================================= */

.form-group{
    margin-bottom:17px;
}

.form-group label{

    display:block;

    margin-bottom:7px;

    color:#456371;

    font-size:13px;

    font-weight:800;
}

.form-group input,
.form-group select,
.form-group textarea{

    width:100%;

    padding:13px 14px;

    border:1px solid var(--border);

    border-radius:12px;

    background:#fbfdfe;

    outline:none;

    color:var(--text);

    transition:.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{

    background:white;

    border-color:var(--teal);

    box-shadow:
        0 0 0 4px rgba(21,155,183,.09);
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}


/* =========================================================
   BUTTON
========================================================= */

.login-button,
.add-button{

    width:100%;

    border:0;

    border-radius:12px;

    padding:14px;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--navy),
            var(--teal)
        );

    font-size:15px;

    font-weight:800;

    box-shadow:
        0 10px 22px rgba(21,155,183,.17);

    transition:.2s;
}

.login-button:hover,
.add-button:hover{

    transform:translateY(-1px);

    box-shadow:
        0 14px 28px rgba(21,155,183,.23);
}


/* =========================================================
   APP
========================================================= */

.app-shell{

    min-height:100vh;

    display:flex;

    background:var(--bg);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    width:245px;

    min-height:100vh;

    position:fixed;

    left:0;
    top:0;
    bottom:0;

    z-index:50;

    display:flex;
    flex-direction:column;

    background:
        linear-gradient(
            180deg,
            #103b51,
            #0b3042
        );

    color:white;

    box-shadow:
        8px 0 30px rgba(10,45,60,.08);
}

.sidebar-brand{

    height:82px;

    padding:0 23px;

    display:flex;
    align-items:center;

    gap:12px;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.sidebar-logo{

    width:43px;
    height:43px;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.12);

    color:white;

    font-size:24px;
    font-weight:900;
}

.sidebar-title{

    font-size:16px;

    font-weight:900;

    letter-spacing:.2px;
}

.sidebar-subtitle{

    margin-top:2px;

    font-size:9px;

    color:rgba(255,255,255,.52);

    letter-spacing:1px;

    text-transform:uppercase;
}


/* =========================================================
   SIDEBAR NAV
========================================================= */

.sidebar-nav{

    padding:24px 13px;

    flex:1;
}

.nav-label{

    padding:
        0 12px 10px;

    color:
        rgba(255,255,255,.40);

    font-size:10px;

    font-weight:800;

    letter-spacing:1.2px;

    text-transform:uppercase;
}

.nav-item{

    width:100%;

    display:flex;
    align-items:center;

    gap:12px;

    padding:12px 13px;

    margin-bottom:5px;

    border-radius:11px;

    color:
        rgba(255,255,255,.70);

    font-size:13px;

    font-weight:700;

    transition:.18s;
}

.nav-item:hover{

    background:
        rgba(255,255,255,.07);

    color:white;
}

.nav-item.active{

    background:
        linear-gradient(
            90deg,
            rgba(33,181,199,.28),
            rgba(33,181,199,.10)
        );

    color:white;

    box-shadow:
        inset 3px 0 var(--teal2);
}

.nav-icon{

    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:
        rgba(255,255,255,.07);

    font-size:14px;
}


/* =========================================================
   SIDEBAR FOOTER
========================================================= */

.sidebar-footer{

    padding:17px;

    border-top:
        1px solid rgba(255,255,255,.08);
}

.clinic-status{

    padding:12px;

    border-radius:12px;

    background:
        rgba(255,255,255,.055);

    font-size:11px;

    color:rgba(255,255,255,.62);
}

.status-dot{

    width:7px;
    height:7px;

    display:inline-block;

    margin-right:7px;

    border-radius:50%;

    background:#36d18e;

    box-shadow:
        0 0 0 4px rgba(54,209,142,.10);
}


/* =========================================================
   CONTENT
========================================================= */

.main-area{

    width:calc(100% - 245px);

    margin-left:245px;

    min-height:100vh;
}


/* =========================================================
   TOP HEADER
========================================================= */

.topbar{

    height:82px;

    padding:
        0 30px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:white;

    border-bottom:
        1px solid var(--border);

    position:sticky;

    top:0;

    z-index:40;
}

.page-heading{

    display:flex;
    align-items:center;

    gap:12px;
}

.page-heading-icon{

    width:40px;
    height:40px;

    border-radius:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--blue-soft);

    color:var(--teal);

    font-size:18px;
}

.page-heading h2{

    color:var(--navy);

    font-size:18px;

    font-weight:900;
}

.page-heading p{

    margin-top:2px;

    color:var(--muted);

    font-size:11px;
}

.user-area{

    display:flex;
    align-items:center;

    gap:12px;
}

.user-info{

    display:flex;
    align-items:center;

    gap:9px;

    color:#5d7580;

    font-size:12px;

    font-weight:700;
}

.user-avatar{

    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--blue-soft);

    color:var(--teal);

    font-weight:900;
}

.logout-button{

    border:
        1px solid var(--border);

    background:white;

    color:#6d818a;

    border-radius:10px;

    padding:9px 12px;

    font-size:12px;

    font-weight:800;
}

.logout-button:hover{

    background:#fff1f2;

    color:var(--red);

    border-color:#f0cdd0;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.main-container{

    max-width:1500px;

    margin:auto;

    padding:
        28px 30px 50px;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome-card{

    min-height:145px;

    position:relative;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        25px 29px;

    margin-bottom:22px;

    border-radius:20px;

    color:white;

    background:
        linear-gradient(
            120deg,
            #0c4e68,
            #128aa5,
            #20b4c4
        );

    box-shadow:
        0 15px 35px rgba(21,155,183,.16);
}

.welcome-card:after{

    content:"✚";

    position:absolute;

    right:50px;
    bottom:-60px;

    font-size:190px;

    opacity:.055;
}

.welcome-card h2{

    font-size:25px;

    font-weight:900;

    margin-bottom:6px;
}

.welcome-card p{

    color:rgba(255,255,255,.76);

    font-size:13px;
}

.doctor-icon{

    width:78px;
    height:78px;

    position:relative;
    z-index:2;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid rgba(255,255,255,.16);

    border-radius:22px;

    background:
        rgba(255,255,255,.10);

    font-size:40px;
}


/* =========================================================
   DATE
========================================================= */

.date-card{

    min-height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    margin-bottom:22px;

    padding:
        12px 16px;

    border:
        1px solid var(--border);

    border-radius:15px;

    background:white;

    box-shadow:var(--shadow);
}

.date-navigation{

    display:flex;
    align-items:center;

    gap:7px;
}

.date-button{

    width:38px;
    height:38px;

    border:
        1px solid var(--border);

    border-radius:9px;

    background:#fafcfd;

    color:var(--teal);

    font-size:18px;

    font-weight:900;
}

.date-button:hover{

    background:var(--blue-soft);

    border-color:#bcdce4;
}

.today-button{

    border:0;

    border-radius:9px;

    padding:9px 13px;

    background:var(--blue-soft);

    color:var(--navy);

    font-size:12px;

    font-weight:900;
}

.current-date{

    text-align:center;
}

.current-date strong{

    display:block;

    color:var(--navy);

    font-size:17px;

    font-weight:900;
}

.current-date span{

    display:block;

    margin-top:3px;

    color:var(--muted);

    font-size:11px;
}


/* =========================================================
   GRID
========================================================= */

.dashboard-grid{

    display:grid;

    grid-template-columns:
        355px minmax(0,1fr);

    gap:22px;

    align-items:start;
}


/* =========================================================
   PANELS
========================================================= */

.panel{

    background:white;

    border:
        1px solid var(--border);

    border-radius:17px;

    overflow:hidden;

    box-shadow:var(--shadow);
}

.panel-header{

    min-height:67px;

    padding:
        13px 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:
        1px solid var(--border);
}

.panel-title{

    display:flex;
    align-items:center;

    gap:10px;

    color:var(--navy);

    font-size:14px;

    font-weight:900;
}

.panel-title-icon{

    width:35px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:var(--blue-soft);

    color:var(--teal);

    font-size:16px;
}

.panel-body{

    padding:19px;
}


/* =========================================================
   APPOINTMENT FORM
========================================================= */

.appointment-form:before{

    content:"REGJISTRIM I VIZITËS";

    display:block;

    margin-bottom:17px;

    padding-bottom:9px;

    border-bottom:
        1px solid var(--border);

    color:#91a2aa;

    font-size:9px;

    font-weight:900;

    letter-spacing:1.2px;
}

.appointment-form .form-group label{

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:.25px;
}

.appointment-form input,
.appointment-form select,
.appointment-form textarea{

    background:#fbfdfe;
}


/* =========================================================
   SCHEDULE
========================================================= */

.schedule-header{

    display:flex;
    align-items:center;

    gap:8px;
}

.schedule-count{

    min-width:28px;

    padding:4px 8px;

    border-radius:20px;

    text-align:center;

    background:var(--blue-soft);

    color:var(--teal);

    font-size:10px;

    font-weight:900;
}

.schedule-list{

    padding:
        7px 12px 15px;
}


/* =========================================================
   APPOINTMENT
========================================================= */

.appointment-row{

    display:grid;

    grid-template-columns:
        82px minmax(0,1fr) auto;

    gap:14px;

    align-items:center;

    min-height:74px;

    padding:
        11px 9px;

    border-bottom:
        1px solid #edf2f4;

    transition:.15s;
}

.appointment-row:last-child{
    border-bottom:0;
}

.appointment-row:hover{

    background:#f8fbfc;

    border-radius:10px;
}

.appointment-time{

    color:var(--navy);

    font-size:13px;

    font-weight:900;
}

.appointment-time:before{

    content:"";

    width:6px;
    height:6px;

    display:inline-block;

    margin-right:6px;

    vertical-align:middle;

    border-radius:50%;

    background:var(--teal);
}

.patient-info{

    min-width:0;
}

.patient-name{

    color:#214c60;

    font-size:14px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.patient-phone{

    margin-top:3px;

    color:#8a9ca4;

    font-size:10px;

    font-weight:600;
}

.patient-note{

    margin-top:3px;

    color:#748991;

    font-size:10px;
}

.appointment-actions{

    display:flex;
    align-items:center;

    justify-content:flex-end;

    gap:5px;

    flex-wrap:wrap;
}


/* =========================================================
   STATUS
========================================================= */

.status-button{

    border:0;

    border-radius:8px;

    padding:
        7px 9px;

    font-size:10px;

    font-weight:900;

    transition:.15s;
}

.status-button:hover{
    transform:translateY(-1px);
}

.status-planned{

    background:#e9f5fa;

    color:#147a98;
}

.status-arrived{

    background:#fff5df;

    color:#a26d12;
}

.status-finished{

    background:#e8f7f0;

    color:#20845d;
}

.status-cancelled{

    background:#fff0f1;

    color:#bd4b55;
}


/* =========================================================
   DELETE
========================================================= */

.delete-button{

    width:30px;
    height:30px;

    border:
        1px solid #efd9dc;

    border-radius:8px;

    background:#fffafa;

    color:var(--red);

    font-size:12px;

    font-weight:900;
}

.delete-button:hover{

    background:#fff0f1;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state{

    padding:
        50px 20px;

    text-align:center;

    color:#93a4ab;
}

.empty-icon{

    width:62px;
    height:62px;

    margin:
        0 auto 13px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:19px;

    background:#eef7fa;

    color:#67a6b8;

    font-size:28px;
}

.empty-state strong{

    display:block;

    margin-bottom:4px;

    color:#607b86;

    font-size:13px;
}

.empty-state span{

    font-size:11px;
}


/* =========================================================
   MESSAGES
========================================================= */

.message{

    margin-bottom:16px;

    padding:
        11px 14px;

    border-radius:10px;

    font-size:12px;

    font-weight:700;
}

.message.success{

    background:#eaf8f2;

    color:#217950;

    border:1px solid #cdeadd;
}

.message.error{

    background:#fff0f1;

    color:#b44750;

    border:1px solid #efd0d3;
}


/* =========================================================
   ERROR
========================================================= */

.fatal-error{

    max-width:650px;

    margin:80px auto;

    padding:30px;

    background:white;

    border:1px solid #efd0d3;

    border-radius:18px;

    color:#a13d47;

    box-shadow:var(--shadow2);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

    .sidebar{
        width:210px;
    }

    .main-area{
        width:calc(100% - 210px);
        margin-left:210px;
    }

    .dashboard-grid{
        grid-template-columns:1fr;
    }
}


@media(max-width:750px){

    .sidebar{
        display:none;
    }

    .main-area{
        width:100%;
        margin-left:0;
    }

    .topbar{
        height:auto;

        padding:
            12px 15px;
    }

    .main-container{
        padding:
            17px 12px 35px;
    }

    .welcome-card{
        min-height:125px;

        padding:20px;

        border-radius:17px;
    }

    .welcome-card h2{
        font-size:19px;
    }

    .doctor-icon{
        width:55px;
        height:55px;

        font-size:29px;
    }

    .date-card{
        flex-direction:column;
    }

    .date-navigation{
        width:100%;

        justify-content:center;
    }

    .appointment-row{

        grid-template-columns:
            65px minmax(0,1fr);
    }

    .appointment-actions{

        grid-column:
            1 / -1;

        justify-content:flex-start;
    }

    .user-info span{
        display:none;
    }
}


@media(max-width:500px){

    .login-card{
        padding:30px 21px;

        border-radius:22px;
    }

    .page-heading p{
        display:none;
    }

    .logout-button{
        padding:8px 9px;
    }

    .brand-subtitle{
        display:none;
    }
}

</style>
</head>


<body>

<div id="app">

    <div class="loading">
        Po ngarkohet sistemi...
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app-gvm.js?v=GVM-20260924-10"></script>

</body>
</html>
```
