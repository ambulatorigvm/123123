<!DOCTYPE html>
<html lang="sq">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AMBULATORI GVM</title>

    <link rel="icon" href="data:,">

    <style>

        /* =====================================================
           GVM MEDICAL SYSTEM
           COMPLETE UI
        ===================================================== */

        :root{

            --blue:#0b6f91;
            --blue-dark:#123f55;
            --blue-light:#eaf7fa;
            --teal:#18a1b8;

            --green:#23a879;
            --green-light:#e9f8f1;

            --orange:#e5a32e;
            --orange-light:#fff4df;

            --red:#d75d68;
            --red-light:#fff0f1;

            --background:#f3f7f9;
            --white:#ffffff;

            --text:#173b4c;
            --muted:#78909c;

            --border:#dce7ec;

            --shadow:
                0 8px 30px rgba(20,65,85,.07);
        }


        /* =====================================================
           RESET
        ===================================================== */

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        html{
            min-height:100%;
        }

        body{

            min-height:100vh;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            color:var(--text);

            background:
                linear-gradient(
                    135deg,
                    #eef5f8 0%,
                    #f7fafb 50%,
                    #eef5f8 100%
                );
        }

        button,
        input,
        select,
        textarea{
            font-family:inherit;
        }

        button{
            cursor:pointer;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading{

            min-height:100vh;

            display:flex;

            flex-direction:column;

            align-items:center;

            justify-content:center;

            color:var(--blue);

            font-size:16px;

            font-weight:700;
        }

        .loading::before{

            content:"✚";

            width:78px;

            height:78px;

            display:flex;

            align-items:center;

            justify-content:center;

            margin-bottom:18px;

            border-radius:24px;

            color:white;

            font-size:40px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue-dark),
                    var(--teal)
                );

            box-shadow:
                0 18px 40px rgba(11,111,145,.20);
        }


        /* =====================================================
           LOGIN
        ===================================================== */

        .login-page{

            min-height:100vh;

            display:flex;

            align-items:center;

            justify-content:center;

            padding:25px;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(24,161,184,.13),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #edf7fa,
                    #f7fafb
                );
        }

        .login-box{

            width:100%;

            max-width:430px;

            padding:42px;

            background:white;

            border:1px solid var(--border);

            border-radius:25px;

            box-shadow:
                0 25px 70px rgba(20,65,85,.13);

            text-align:center;
        }

        .login-logo{

            width:82px;

            height:82px;

            margin:0 auto 18px;

            display:flex;

            align-items:center;

            justify-content:center;

            border-radius:23px;

            color:white;

            background:
                linear-gradient(
                    135deg,
                    var(--blue-dark),
                    var(--teal)
                );

            box-shadow:
                0 15px 35px rgba(11,111,145,.20);
        }

        .login-logo span{

            font-size:24px;

            font-weight:900;
        }

        .login-title{

            color:var(--blue-dark);

            font-size:25px;

            font-weight:900;

            margin-bottom:6px;
        }

        .login-subtitle{

            color:var(--muted);

            font-size:13px;

            margin-bottom:28px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group{

            margin-bottom:17px;

            text-align:left;
        }

        .form-group label{

            display:block;

            margin-bottom:7px;

            color:#4e6874;

            font-size:11px;

            font-weight:800;

            text-transform:uppercase;

            letter-spacing:.4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea{

            width:100%;

            padding:12px 13px;

            border:1px solid var(--border);

            border-radius:10px;

            outline:none;

            color:var(--text);

            background:#fbfdfe;

            font-size:13px;

            transition:.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus{

            border-color:var(--teal);

            background:white;

            box-shadow:
                0 0 0 4px rgba(24,161,184,.09);
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button{

            width:100%;

            padding:13px 15px;

            border:0;

            border-radius:10px;

            color:white;

            background:
                linear-gradient(
                    135deg,
                    var(--blue-dark),
                    var(--blue)
                );

            font-size:13px;

            font-weight:800;

            box-shadow:
                0 10px 25px rgba(11,111,145,.18);

            transition:.2s;
        }

        .login-button:hover{

            transform:translateY(-1px);

            box-shadow:
                0 14px 30px rgba(11,111,145,.24);
        }

        .error-message{

            display:none;

            margin-top:12px;

            padding:10px;

            border-radius:9px;

            color:#b44650;

            background:var(--red-light);

            font-size:12px;

            font-weight:700;
        }


        /* =====================================================
           APP HEADER
        ===================================================== */

        .app-header{

            position:sticky;

            top:0;

            z-index:100;

            height:76px;

            background:
                rgba(255,255,255,.97);

            border-bottom:
                1px solid var(--border);

            box-shadow:
                0 4px 20px rgba(20,65,85,.05);

            backdrop-filter:blur(12px);
        }

        .header-inner{

            height:100%;

            max-width:1550px;

            margin:auto;

            padding:0 30px;

            display:flex;

            align-items:center;

            justify-content:space-between;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand{

            display:flex;

            align-items:center;

            gap:12px;
        }

        .brand-icon{

            width:46px;

            height:46px;

            display:flex;

            align-items:center;

            justify-content:center;

            border-radius:13px;

            color:white;

            background:
                linear-gradient(
                    135deg,
                    var(--blue-dark),
                    var(--teal)
                );

            font-size:13px;

            font-weight:900;

            box-shadow:
                0 8px 20px rgba(11,111,145,.18);
        }

        .brand h1{

            color:var(--blue-dark);

            font-size:18px;

            font-weight:900;

            letter-spacing:.2px;
        }

        .brand small{

            display:block;

            margin-top:2px;

            color:var(--muted);

            font-size:10px;

            font-weight:600;
        }


        /* =====================================================
           HEADER ACTIONS
        ===================================================== */

        .header-actions{

            display:flex;

            align-items:center;

            gap:12px;
        }

        .online-indicator{

            display:flex;

            align-items:center;

            gap:6px;

            padding:7px 10px;

            border-radius:20px;

            color:#23805f;

            background:#effaf5;

            font-size:11px;

            font-weight:800;
        }

        .online-indicator span{

            width:7px;

            height:7px;

            border-radius:50%;

            background:#27b47e;

            box-shadow:
                0 0 0 4px rgba(39,180,126,.10);
        }

        .user-email{

            max-width:220px;

            overflow:hidden;

            text-overflow:ellipsis;

            white-space:nowrap;

            color:#627984;

            font-size:12px;

            font-weight:700;
        }

        .logout-button{

            padding:9px 14px;

            border:1px solid var(--border);

            border-radius:9px;

            color:#607780;

            background:white;

            font-size:11px;

            font-weight:800;

            transition:.2s;
        }

        .logout-button:hover{

            color:var(--red);

            border-color:#efd1d5;

            background:var(--red-light);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main-container{

            width:100%;

            max-width:1550px;

            margin:auto;

            padding:28px 30px 55px;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .app-message{

            display:none;

            margin-bottom:15px;

            padding:12px 15px;

            border-radius:10px;

            font-size:12px;

            font-weight:700;
        }

        .app-message.success{

            display:block;

            color:#197454;

            background:var(--green-light);

            border:1px solid #ccebdc;
        }

        .app-message.error{

            display:block;

            color:#b44650;

            background:var(--red-light);

            border:1px solid #efd0d4;
        }


        /* =====================================================
           PAGE TITLE
        ===================================================== */

        .page-title{

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:20px;

            margin-bottom:20px;
        }

        .section-kicker{

            margin-bottom:4px;

            color:var(--teal);

            font-size:10px;

            font-weight:900;

            letter-spacing:1.3px;
        }

        .page-title h2{

            color:var(--blue-dark);

            font-size:25px;

            font-weight:900;
        }


        /* =====================================================
           DATE CONTROLS
        ===================================================== */

        .date-controls{

            display:flex;

            align-items:center;

            gap:7px;

            padding:6px;

            background:white;

            border:1px solid var(--border);

            border-radius:12px;

            box-shadow:var(--shadow);
        }

        .date-button{

            width:36px;

            height:36px;

            display:flex;

            align-items:center;

            justify-content:center;

            border:0;

            border-radius:8px;

            color:var(--blue);

            background:#f5fafb;

            font-size:17px;

            font-weight:900;

            transition:.2s;
        }

        .date-button:hover{

            background:var(--blue-light);
        }

        .today-button{

            width:auto;

            padding:0 12px;

            color:var(--blue-dark);

            background:var(--blue-light);

            font-size:11px;
        }

        .current-date{

            min-width:190px;

            padding:0 10px;

            color:var(--blue-dark);

            text-align:center;

            font-size:12px;

            font-weight:800;

            text-transform:capitalize;
        }


        /* =====================================================
           DASHBOARD SUMMARY
        ===================================================== */

        .dashboard-summary{

            display:grid;

            grid-template-columns:
                repeat(4,1fr);

            gap:15px;

            margin-bottom:22px;
        }

        .summary-card{

            min-height:92px;

            display:flex;

            align-items:center;

            gap:13px;

            padding:16px;

            background:white;

            border:1px solid var(--border);

            border-radius:14px;

            box-shadow:var(--shadow);

            transition:.2s;
        }

        .summary-card:hover{

            transform:translateY(-2px);

            box-shadow:
                0 12px 35px rgba(20,65,85,.10);
        }

        .summary-icon{

            width:45px;

            height:45px;

            flex:0 0 45px;

            display:flex;

            align-items:center;

            justify-content:center;

            border-radius:12px;

            color:var(--blue);

            background:var(--blue-light);

            font-size:19px;
        }

        .summary-card:nth-child(2)
        .summary-icon{

            color:var(--orange);

            background:var(--orange-light);
        }

        .summary-card:nth-child(3)
        .summary-icon{

            color:var(--green);

            background:var(--green-light);
        }

        .summary-card:nth-child(4)
        .summary-icon{

            color:var(--teal);

            background:#e9f8fa;
        }

        .summary-card span{

            display:block;

            margin-bottom:4px;

            color:var(--muted);

            font-size:10px;

            font-weight:700;
        }

        .summary-card strong{

            color:var(--blue-dark);

            font-size:24px;

            font-weight:900;
        }


        /* =====================================================
           APPOINTMENT CARD
        ===================================================== */

        .appointment-card{

            margin-bottom:22px;

            padding:20px;

            background:white;

            border:1px solid var(--border);

            border-radius:17px;

            box-shadow:var(--shadow);
        }

        .card-heading{

            display:flex;

            align-items:center;

            justify-content:space-between;

            margin-bottom:18px;

            padding-bottom:14px;

            border-bottom:1px solid var(--border);
        }

        .card-kicker{

            display:block;

            margin-bottom:4px;

            color:#93a3aa;

            font-size:9px;

            font-weight:900;

            letter-spacing:1.2px;
        }

        .card-heading h3{

            color:var(--blue-dark);

            font-size:17px;

            font-weight:900;
        }

        .medical-cross{

            width:38px;

            height:38px;

            display:flex;

            align-items:center;

            justify-content:center;

            border-radius:10px;

            color:white;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--teal)
                );

            font-size:24px;

            font-weight:400;
        }

        .appointment-form{

            display:grid;

            grid-template-columns:
                1.3fr 1fr .7fr 1.2fr auto;

            gap:12px;

            align-items:end;
        }

        .appointment-form .form-group{

            margin-bottom:0;
        }

        .appointment-form .form-group label{

            font-size:10px;
        }

        .add-button{

            width:auto;

            min-width:125px;

            height:42px;

            padding:0 17px;

            display:flex;

            align-items:center;

            justify-content:center;

            gap:7px;

            border:0;

            border-radius:10px;

            color:white;

            background:
                linear-gradient(
                    135deg,
                    var(--blue-dark),
                    var(--blue)
                );

            font-size:11px;

            font-weight:800;

            box-shadow:
                0 8px 20px rgba(11,111,145,.16);

            transition:.2s;
        }

        .add-button span{

            font-size:17px;
        }

        .add-button:hover{

            transform:translateY(-1px);

            box-shadow:
                0 12px 25px rgba(11,111,145,.22);
        }


        /* =====================================================
           SCHEDULE CARD
        ===================================================== */

        .schedule-card{

            overflow:hidden;

            background:white;

            border:1px solid var(--border);

            border-radius:17px;

            box-shadow:var(--shadow);
        }

        .schedule-header{

            min-height:75px;

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:20px;

            padding:16px 20px;

            border-bottom:1px solid var(--border);
        }

        .schedule-header h3{

            color:var(--blue-dark);

            font-size:17px;

            font-weight:900;
        }

        .schedule-header-right{

            display:flex;

            align-items:center;

            gap:12px;
        }

        .working-hours{

            padding:8px 11px;

            border-radius:8px;

            color:var(--blue);

            background:var(--blue-light);

            font-size:10px;

            font-weight:800;
        }

        .schedule-info{

            color:var(--muted);

            font-size:11px;

            font-weight:700;
        }


        /* =====================================================
           TABLE
        ===================================================== */

        .schedule-table-wrapper{

            width:100%;

            overflow-x:auto;

            padding:12px 15px 18px;
        }

        .schedule-table{

            width:100%;

            min-width:900px;

            border-collapse:separate;

            border-spacing:0 5px;
        }

        .schedule-table thead th{

            padding:10px 12px;

            text-align:left;

            color:#78909c;

            background:#f4f8fa;

            border-top:1px solid #e5edf0;

            border-bottom:1px solid #e5edf0;

            font-size:9px;

            font-weight:900;

            text-transform:uppercase;

            letter-spacing:.7px;
        }

        .schedule-table thead th:first-child{

            border-left:1px solid #e5edf0;

            border-radius:8px 0 0 8px;
        }

        .schedule-table thead th:last-child{

            border-right:1px solid #e5edf0;

            border-radius:0 8px 8px 0;
        }

        .schedule-table tbody td{

            padding:10px 12px;

            background:white;

            border-top:1px solid #e8eff2;

            border-bottom:1px solid #e8eff2;

            font-size:11px;

            vertical-align:middle;
        }

        .schedule-table tbody td:first-child{

            border-left:1px solid #e8eff2;

            border-radius:9px 0 0 9px;
        }

        .schedule-table tbody td:last-child{

            border-right:1px solid #e8eff2;

            border-radius:0 9px 9px 0;
        }

        .schedule-table tbody tr{

            transition:.15s;
        }

        .schedule-table tbody tr:hover{

            transform:translateY(-1px);

            box-shadow:
                0 5px 18px rgba(20,65,85,.05);
        }


        /* =====================================================
           TIME
        ===================================================== */

        .time-cell{

            width:100px;
        }

        .time-badge{

            display:flex;

            align-items:center;

            gap:7px;

            color:var(--blue-dark);

            font-size:12px;

            font-weight:900;
        }

        .time-icon{

            color:var(--teal);

            font-size:15px;
        }

        .time-label{

            color:var(--blue-dark);

            font-weight:900;
        }


        /* =====================================================
           PATIENT
        ===================================================== */

        .patient-main{

            display:flex;

            align-items:center;

            gap:9px;
        }

        .patient-avatar{

            width:34px;

            height:34px;

            flex:0 0 34px;

            display:flex;

            align-items:center;

            justify-content:center;

            border-radius:10px;

            color:var(--blue);

            background:var(--blue-light);

            font-size:10px;

            font-weight:900;
        }

        .patient-details strong{

            display:block;

            color:#214a5d;

            font-size:12px;

            font-weight:900;
        }

        .patient-details span{

            display:block;

            margin-top:2px;

            color:#9aa9ae;

            font-size:9px;
        }


        /* =====================================================
           PHONE
        ===================================================== */

        .phone-link{

            color:var(--blue);

            text-decoration:none;

            font-size:11px;

            font-weight:700;
        }

        .phone-link span{

            margin-right:4px;
        }

        .phone-link:hover{

            text-decoration:underline;
        }

        .muted-text{

            color:#a3b0b5;

            font-size:10px;
        }


        /* =====================================================
           NOTE
        ===================================================== */

        .note-text{

            display:block;

            max-width:200px;

            overflow:hidden;

            white-space:nowrap;

            text-overflow:ellipsis;

            color:#6e838d;

            font-size:10px;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status{

            display:inline-flex;

            align-items:center;

            gap:6px;

            padding:6px 9px;

            border-radius:20px;

            font-size:9px;

            font-weight:900;

            white-space:nowrap;
        }

        .status-dot{

            width:6px;

            height:6px;

            border-radius:50%;

            display:inline-block;
        }

        .status-planned{

            color:#177691;

            background:#eaf6fa;
        }

        .status-planned .status-dot{

            background:#2299b7;
        }

        .status-arrived{

            color:#9b6913;

            background:#fff4df;
        }

        .status-arrived .status-dot{

            background:#e4a52f;
        }

        .status-finished{

            color:#1c7a57;

            background:#e9f8f1;
        }

        .status-finished .status-dot{

            background:#27aa78;
        }

        .status-cancelled{

            color:#b84953;

            background:#fff0f1;
        }

        .status-cancelled .status-dot{

            background:#d75d68;
        }


        /* =====================================================
           ACTIONS
        ===================================================== */

        .appointment-actions{

            display:flex;

            align-items:center;

            gap:5px;

            flex-wrap:wrap;
        }

        .action-button{

            padding:6px 8px;

            border:0;

            border-radius:7px;

            font-size:9px;

            font-weight:800;

            transition:.15s;
        }

        .action-arrived{

            color:#916313;

            background:#fff4df;
        }

        .action-arrived:hover{

            background:#ffe9bd;
        }

        .action-finished{

            color:#197454;

            background:#e9f8f1;
        }

        .action-finished:hover{

            background:#d7f2e5;
        }

        .action-cancel{

            color:#b44650;

            background:#fff0f1;
        }

        .action-cancel:hover{

            background:#ffe1e4;
        }

        .action-delete{

            color:#b44650;

            background:#fff0f1;

            border:1px solid #efd0d4;
        }

        .action-delete:hover{

            background:#ffdfe3;
        }


        /* =====================================================
           FREE SLOT
        ===================================================== */

        .free-slot{

            display:flex;

            align-items:center;

            gap:7px;

            color:#a2b0b5;

            font-size:10px;
        }

        .free-dot{

            width:6px;

            height:6px;

            border-radius:50%;

            background:#c7d3d7;
        }

        .empty-time-row td{

            background:#fcfefe !important;
        }


        /* =====================================================
           EMPTY DAY
        ===================================================== */

        .empty-day-cell{

            padding:0 !important;

            border:0 !important;

        }

        .empty-day{

            padding:55px 20px;

            text-align:center;
        }

        .empty-day-icon{

            width:62px;

            height:62px;

            margin:0 auto 12px;

            display:flex;

            align-items:center;

            justify-content:center;

            border-radius:18px;

            color:var(--teal);

            background:var(--blue-light);

            font-size:27px;
        }

        .empty-day h4{

            margin-bottom:5px;

            color:#5f7985;

            font-size:13px;

            font-weight:900;
        }

        .empty-day p{

            max-width:500px;

            margin:auto;

            color:#9aa9ae;

            font-size:11px;

            line-height:1.6;
        }


        /* =====================================================
           LOADING TABLE
        ===================================================== */

        .loading-cell{

            padding:45px !important;

            text-align:center;

            color:var(--muted);

            font-size:11px;
        }

        .loading-spinner{

            width:25px;

            height:25px;

            margin:0 auto 10px;

            border:3px solid #dceef2;

            border-top-color:var(--teal);
