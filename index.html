```html
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AMBULATORI GVM</title>

    <!-- Nuk kërkon favicon.ico -->
    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #2563eb;
            font-weight: 600;
        }

        /* LOGIN */

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #eaf2ff, #f8fbff);
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }

        .login-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            font-weight: 800;
        }

        .login-title {
            text-align: center;
            margin: 0;
            font-size: 28px;
            color: #111827;
        }

        .login-subtitle {
            text-align: center;
            color: #6b7280;
            margin: 8px 0 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
            color: #374151;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .error-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 14px;
            display: none;
        }

        /* HEADER */

        .app-header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 15px 25px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1450px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .brand h1 {
            margin: 0;
            font-size: 21px;
        }

        .brand small {
            color: #6b7280;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-email {
            color: #4b5563;
            font-size: 14px;
        }

        .logout-button {
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-button:hover {
            background: #f3f4f6;
        }

        /* MAIN */

        .main-container {
            max-width: 1450px;
            margin: 0 auto;
            padding: 25px;
        }

        .page-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
        }

        .page-title h2 {
            margin: 0;
            font-size: 25px;
        }

        .date-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-button {
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            padding: 9px 13px;
            cursor: pointer;
            font-weight: 600;
        }

        .date-button:hover {
            background: #f3f4f6;
        }

        .current-date {
            min-width: 180px;
            text-align: center;
            font-weight: 700;
        }

        /* APPOINTMENT FORM */

        .appointment-card {
            background: white;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        .appointment-card h3 {
            margin: 0 0 18px;
            font-size: 19px;
        }

        .appointment-form {
            display: grid;
            grid-template-columns: 1.1fr 1.1fr 0.7fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .add-button {
            border: none;
            background: #16a34a;
            color: white;
            border-radius: 9px;
            padding: 13px 20px;
            cursor: pointer;
            font-weight: 700;
            height: 45px;
        }

        .add-button:hover {
            background: #15803d;
        }

        /* SCHEDULE */

        .schedule-card {
            background: white;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        .schedule-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .schedule-header h3 {
            margin: 0;
        }

        .schedule-info {
            color: #6b7280;
            font-size: 14px;
        }

        .schedule-table-wrapper {
            overflow-x: auto;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        .schedule-table th {
            background: #f8fafc;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            color: #6b7280;
            border-bottom: 1px solid #e5e7eb;
        }

        .schedule-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eef2f7;
            vertical-align: middle;
        }

        .time-cell {
            width: 90px;
            font-weight: 700;
            color: #374151;
        }

        .empty-slot {
            color: #9ca3af;
            font-size: 14px;
        }

        /* PATIENT */

        .patient-card {
            border: 1px solid #dbeafe;
            background: #f8fbff;
            border-radius: 11px;
            padding: 12px;
        }

        .patient-name {
            font-weight: 800;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .patient-info {
            color: #6b7280;
            font-size: 13px;
            margin-top: 3px;
        }

        .patient-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 9px;
        }

        .status-button,
        .delete-button {
            border: none;
            border-radius: 7px;
            padding: 7px 9px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .status-button {
            background: #e5e7eb;
            color: #374151;
        }

        .status-button:hover {
            background: #d1d5db;
        }

        .delete-button {
            background: #fee2e2;
            color: #991b1b;
        }

        .delete-button:hover {
            background: #fecaca;
        }

        /* STATUS */

        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            margin-top: 5px;
        }

        .status-planned {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-arrived {
            background: #fef3c7;
            color: #92400e;
        }

        .status-finished {
            background: #dcfce7;
            color: #166534;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        /* MESSAGES */

        .app-message {
            padding: 13px 16px;
            border-radius: 9px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .app-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .app-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        /* FATAL ERROR */

        .fatal-error {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: #fef2f2;
        }

        .fatal-box {
            max-width: 700px;
            background: white;
            border: 1px solid #fecaca;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        .fatal-box h2 {
            margin-top: 0;
            color: #991b1b;
        }

        /* RESPONSIVE */

        @media (max-width: 1000px) {
            .appointment-form {
                grid-template-columns: 1fr 1fr;
            }

            .add-button {
                width: 100%;
            }
        }

        @media (max-width: 700px) {
            .app-header {
                padding: 12px 15px;
            }

            .header-inner {
                align-items: flex-start;
            }

            .user-email {
                display: none;
            }

            .main-container {
                padding: 15px;
            }

            .page-title {
                flex-direction: column;
                align-items: stretch;
            }

            .date-controls {
                justify-content: space-between;
                flex-wrap: wrap;
            }

            .appointment-form {
                grid-template-columns: 1fr;
            }

            .login-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="loading">
            Po ngarkohet sistemi...
        </div>
    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app-gvm.js?v=GVM-20260924-07"></script>

</body>
</html>
