```html
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AMBULATORI GVM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(rgba(4, 35, 55, 0.72), rgba(5, 57, 76, 0.78)),
                url("https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=2000&q=85")
                center / cover fixed;
            color: #183b4b;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           LOADING
        ========================= */

        .loading-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .loading-box {
            background: rgba(255,255,255,0.96);
            border-radius: 22px;
            padding: 40px;
            width: min(450px, 100%);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #dcecf1;
            border-top-color: #0b9db0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           LOGIN
        ========================= */

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: min(450px, 100%);
            background: rgba(255,255,255,0.97);
            border-radius: 26px;
            padding: 38px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.30);
        }

        .login-logo {
            width: 78px;
            height: 78px;
            border-radius: 22px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #087f98, #12b8ae);
            color: white;
            font-size: 34px;
            font-weight: bold;
        }

        .login-title {
            text-align: center;
            margin: 0;
            color: #103f51;
            font-size: 27px;
        }

        .login-subtitle {
            text-align: center;
            color: #6c8490;
            margin: 8px 0 28px;
        }

        .input-label {
            display: block;
            font-weight: 700;
            margin-bottom: 7px;
            color: #365865;
        }

        .input {
            width: 100%;
            border: 1px solid #cbdde3;
            background: #f8fcfd;
            border-radius: 13px;
            padding: 13px 14px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input:focus {
            border-color: #0a9cad;
            box-shadow: 0 0 0 4px rgba(10,156,173,0.10);
        }

        .form-row {
            margin-bottom: 17px;
        }

        .login-button {
            width: 100%;
            border: 0;
            border-radius: 13px;
            padding: 14px;
            background: linear-gradient(135deg, #087f98, #10aaa9);
            color: white;
            font-weight: 800;
            font-size: 16px;
            margin-top: 5px;
        }

        .login-button:hover {
            filter: brightness(1.05);
        }

        .login-error {
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #f3c0c0;
            border-radius: 12px;
            padding: 11px;
            margin-top: 15px;
            font-size: 14px;
        }

        /* =========================
           APP
        ========================= */

        .app-page {
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .topbar-inner {
            width: min(1450px, calc(100% - 30px));
            margin: auto;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #087f98, #11aaa8);
            color: white;
            font-size: 23px;
            font-weight: bold;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 900;
            color: #123e4d;
        }

        .brand-subtitle {
            color: #77909a;
            font-size: 12px;
            margin-top: 2px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-badge {
            padding: 9px 12px;
            border-radius: 12px;
            background: #eef8fa;
            color: #176176;
            font-size: 13px;
            font-weight: 700;
        }

        .logout-button {
            border: 0;
            border-radius: 11px;
            padding: 10px 14px;
            background: #f3f6f7;
            color: #365865;
            font-weight: 700;
        }

        .logout-button:hover {
            background: #e7eef0;
        }

        .page {
            width: min(1450px, calc(100% - 30px));
            margin: 22px auto 0;
        }

        /* =========================
           DATE
        ========================= */

        .date-panel {
            background: rgba(255,255,255,0.96);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.13);
            margin-bottom: 20px;
        }

        .date-info {
            text-align: center;
            flex: 1;
        }

        .date-label {
            color: #77909a;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .date-value {
            font-size: 22px;
            font-weight: 900;
            color: #123e4d;
        }

        .date-button {
            border: 0;
            background: #eef7f9;
            color: #126579;
            border-radius: 12px;
            padding: 11px 18px;
            font-weight: 800;
        }

        .date-button:hover {
            background: #dff0f4;
        }

        .today-button {
            background: linear-gradient(135deg, #087f98, #11aaa8);
            color: white;
        }

        /* =========================
           GRID
        ========================= */

        .main-grid {
            display: grid;
            grid-template-columns: 370px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .card {
            background: rgba(255,255,255,0.97);
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.13);
            overflow: hidden;
        }

        .card-header {
            padding: 20px 22px 10px;
        }

        .card-title {
            margin: 0;
            color: #123e4d;
            font-size: 20px;
        }

        .card-description {
            margin: 6px 0 0;
            color: #80939b;
            font-size: 13px;
        }

        .card-body {
            padding: 20px 22px 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #42626d;
            font-size: 13px;
            font-weight: 800;
        }

        .form-control {
            width: 100%;
            border: 1px solid #d3e1e5;
            background: #fbfdfe;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: #0a9cad;
            box-shadow: 0 0 0 4px rgba(10,156,173,0.09);
        }

        .submit-button {
            width: 100%;
            border: 0;
            border-radius: 13px;
            padding: 13px;
            background: linear-gradient(135deg, #087f98, #10aaa9);
            color: white;
            font-size: 15px;
            font-weight: 900;
            margin-top: 5px;
        }

        .submit-button:hover {
            filter: brightness(1.05);
        }

        .message {
            padding: 11px 12px;
            border-radius: 11px;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .message.error {
            background: #fff1f1;
            color: #a52323;
        }

        .message.success {
            background: #eefaf4;
            color: #197048;
        }

        /* =========================
           SCHEDULE
        ========================= */

        .schedule-card {
            min-width: 0;
        }

        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 20px 22px;
            border-bottom: 1px solid #edf2f3;
        }

        .schedule-title {
            margin: 0;
            color: #123e4d;
            font-size: 20px;
        }

        .appointment-count {
            background: #eef8fa;
            color: #126579;
            border-radius: 20px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 900;
        }

        #appointments {
            padding: 10px 14px 18px;
        }

        .time-slot {
            display: grid;
            grid-template-columns: 78px minmax(0,1fr);
            min-height: 75px;
            border-bottom: 1px solid #eef3f4;
        }

        .time-slot:last-child {
            border-bottom: 0;
        }

        .slot-time {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
            color: #64808a;
            font-size: 13px;
            font-weight: 900;
        }

        .slot-content {
            padding: 8px 5px;
        }

        /* =========================
           PATIENT CARD
        ========================= */

        .patient-card {
            min-height: 58px;
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: 0.2s ease;
        }

        /* PLANIFIKUAR - BLU E LEHTE */

        .patient-card.planned {
            background: #f4f9ff !important;
            border: 1px solid #cfe2f2 !important;
            border-left: 5px solid #3287d7 !important;
        }

        /* ERDHI - JESHILe E LEHTE */

        .patient-card.arrived {
            background: #e9f8ef !important;
            border: 1px solid #bfe4cd !important;
            border-left: 5px solid #35a66f !important;
            box-shadow: 0 3px 12px rgba(53,166,111,0.12);
        }

        /* PERFUNDOI - JESHILe / TEAL E LEHTE */

        .patient-card.finished {
            background: #e8f7f2 !important;
            border: 1px solid #c0e5d9 !important;
            border-left: 5px solid #168f78 !important;
            box-shadow: 0 3px 12px rgba(22,143,120,0.10);
        }

        /* ANULUAR - E KUQE E LEHTE */

        .patient-card.cancelled {
            background: #fff0f0 !important;
            border: 1px solid #efcccc !important;
            border-left: 5px solid #c65353 !important;
            opacity: 0.88;
        }

        .patient-info {
            min-width: 0;
            flex: 1;
        }

        .patient-name {
            font-size: 15px;
            font-weight: 900;
            color: #183f4d;
            word-break: break-word;
        }

        .patient-details {
            margin-top: 4px;
            color: #718890;
            font-size: 12px;
        }

        .status {
            display: inline-block;
            margin-top: 5px;
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .status-planned {
            background: #e7f2ff;
            color: #246aa8;
        }

        .status-arrived {
            background: #d9f2e3;
            color: #237b52;
        }

        .status-finished {
            background: #dcefe9;
            color: #177661;
        }

        .status-cancelled {
            background: #fde2e2;
            color: #a33d3d;
        }

        .appointment-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: flex-end;
        }

        .action-button {
            border: 0;
            border-radius: 8px;
            padding: 7px 9px;
            font-size: 11px;
            font-weight: 800;
        }

        .action-arrived {
            background: #dff3e7;
            color: #237b52;
        }

        .action-finished {
            background: #dcf6e7;
            color: #19734a;
        }

        .action-cancel {
            background: #fde4e4;
            color: #a53d3d;
        }

        .action-delete {
            background: #f0f2f3;
            color: #52676f;
        }

        .empty-slot {
            min-height: 58px;
            border: 2px dashed #d8e8ec;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #91a6ad;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .empty-slot:hover {
            border-color: #73bdc8;
            background: #f3fbfc;
            color: #217a8b;
        }

        .empty-slot strong {
            color: inherit;
        }

        .loading-schedule {
            padding: 50px;
            text-align: center;
            color: #80949c;
        }

        .error-box {
            margin: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #fff0f0;
            border: 1px solid #efc1c1;
            color: #a52626;
            font-size: 14px;
        }

        .no-appointments {
            padding: 20px;
            margin: 10px;
            background: #f4fafb;
            border-radius: 14px;
            color: #69818a;
            text-align: center;
            font-size: 13px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 950px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .topbar-inner {
                flex-wrap: wrap;
                padding: 12px 0;
            }
        }

        @media (max-width: 650px) {
            .page {
                width: min(100% - 16px, 1450px);
                margin-top: 10px;
            }

            .topbar-inner {
                width: calc(100% - 16px);
            }

            .date-panel {
                flex-wrap: wrap;
            }

            .date-info {
                order: -1;
                width: 100%;
                flex-basis: 100%;
            }

            .time-slot {
                grid-template-columns: 58px minmax(0,1fr);
            }

            .patient-card {
                flex-direction: column;
                align-items: stretch;
            }

            .appointment-actions {
                justify-content: flex-start;
            }

            .brand-title {
                font-size: 16px;
            }

            .user-badge {
                display: none;
            }
        }
    </style>
</head>

<body>

<div id="app">
    <div class="loading-page">
        <div class="loading-box">
            <div class="spinner"></div>
            <h2>AMBULATORI GVM</h2>
            <p>Po ngarkohet sistemi...</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js?v=GVM-20260924-01"></script>

</body>
</html>
```
