```html
<!DOCTYPE html>
<html lang="sq">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AMBULATORI GVM</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #183247;

      background:
        linear-gradient(
          rgba(238, 247, 251, 0.94),
          rgba(247, 250, 252, 0.97)
        ),
        url("https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=2200&q=85");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }


    /* =====================================================
       APP BACKGROUND
    ===================================================== */

    #app {
      min-height: 100vh;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .topbar {

      height: 76px;

      background:
        rgba(255, 255, 255, 0.96);

      border-bottom:
        1px solid rgba(190, 211, 222, 0.8);

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        0 34px;

      position: sticky;

      top: 0;

      z-index: 100;

      box-shadow:
        0 2px 12px rgba(30, 65, 85, 0.07);

      backdrop-filter:
        blur(10px);
    }


    .brand {

      display: flex;

      align-items: center;

      gap: 13px;

    }


    .brand-icon {

      width: 46px;

      height: 46px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #087ea4,
          #075b82
        );

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 28px;

      font-weight: bold;

      box-shadow:
        0 5px 15px
        rgba(7, 91, 130, 0.22);

    }


    .brand-text h1 {

      margin: 0;

      color: #12344b;

      font-size: 19px;

      letter-spacing: 0.2px;

    }


    .brand-text span {

      display: block;

      margin-top: 3px;

      color: #78909c;

      font-size: 12px;

    }


    .top-status {

      display: flex;

      align-items: center;

      gap: 8px;

      color: #607d8b;

      font-size: 13px;

    }


    .online-dot {

      width: 9px;

      height: 9px;

      border-radius: 50%;

      background: #26a65b;

      box-shadow:
        0 0 0 4px rgba(38, 166, 91, 0.10);

    }


    #logoutButton {

      margin-left: 15px !important;

      border:
        1px solid #d2e0e7 !important;

      background:
        white !important;

      color:
        #526b7b !important;

      padding:
        8px 13px !important;

      border-radius:
        8px !important;

      cursor:
        pointer;

      transition:
        0.2s;

    }


    #logoutButton:hover {

      background:
        #eef7fa !important;

      border-color:
        #a9cbd8 !important;

    }


    /* =====================================================
       PAGE
    ===================================================== */

    .page {

      max-width: 1500px;

      margin: auto;

      padding:
        30px 30px 45px;

    }


    .page-title {

      margin-bottom: 18px;

    }


    .page-title h2 {

      margin: 0;

      color: #12344b;

      font-size: 26px;

      font-weight: 700;

    }


    .page-title p {

      margin:
        6px 0 0;

      color: #708692;

      font-size: 13px;

    }


    /* =====================================================
       DATE PANEL
    ===================================================== */

    .date-panel {

      background:
        rgba(255, 255, 255, 0.96);

      border:
        1px solid #dce8ee;

      border-radius:
        14px;

      padding:
        15px 18px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom:
        20px;

      box-shadow:
        0 5px 20px
        rgba(30, 70, 90, 0.06);

      backdrop-filter:
        blur(8px);

    }


    .date-left {

      display: flex;

      align-items: center;

      gap: 13px;

    }


    .date-icon {

      width: 43px;

      height: 43px;

      border-radius: 11px;

      background:
        #e7f5fa;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 20px;

    }


    .date-label {

      display: block;

      color: #81939d;

      font-size: 10px;

      text-transform: uppercase;

      font-weight: bold;

      letter-spacing: 0.5px;

    }


    #currentDate {

      display: block;

      margin-top: 3px;

      color: #173b52;

      font-size: 17px;

      font-weight: bold;

    }


    .date-buttons {

      display: flex;

      gap: 8px;

    }


    .date-buttons button {

      border:
        1px solid #d3e0e7;

      background:
        #ffffff;

      color:
        #36576b;

      border-radius:
        8px;

      padding:
        9px 13px;

      cursor:
        pointer;

      font-size:
        12px;

      font-weight:
        600;

      transition:
        0.2s;

    }


    .date-buttons button:hover {

      background:
        #eef7fa;

      border-color:
        #b5d2de;

    }


    .today-btn {

      background:
        #087ea4 !important;

      color:
        white !important;

      border-color:
        #087ea4 !important;

    }


    .today-btn:hover {

      background:
        #076b8b !important;

    }


    /* =====================================================
       MAIN GRID
    ===================================================== */

    .main-grid {

      display: grid;

      grid-template-columns:
        330px minmax(0, 1fr);

      gap: 20px;

      align-items: start;

    }


    /* =====================================================
       CARDS
    ===================================================== */

    .card {

      background:
        rgba(255, 255, 255, 0.97);

      border:
        1px solid #dce7ed;

      border-radius:
        14px;

      overflow:
        hidden;

      box-shadow:
        0 7px 25px
        rgba(30, 70, 90, 0.07);

      backdrop-filter:
        blur(8px);

    }


    /* =====================================================
       CARD HEADER
    ===================================================== */

    .card-header {

      padding:
        19px 20px;

      border-bottom:
        1px solid #edf2f5;

      background:
        linear-gradient(
          180deg,
          #ffffff,
          #fbfdfe
        );

    }


    .card-header h3 {

      margin: 0;

      color: #173a51;

      font-size: 16px;

    }


    .card-header p {

      margin:
        5px 0 0;

      color: #8496a0;

      font-size: 12px;

    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-body {

      padding:
        20px;

    }


    .form-group {

      margin-bottom:
        15px;

    }


    .form-group label {

      display: block;

      margin-bottom:
        6px;

      color:
        #526b7a;

      font-size:
        12px;

      font-weight:
        bold;

    }


    .form-group input,
    .form-group select {

      width: 100%;

      height: 43px;

      border:
        1px solid #d4e1e7;

      border-radius:
        8px;

      padding:
        0 12px;

      background:
        #ffffff;

      outline:
        none;

      font-size:
        13px;

      color:
        #263f50;

      transition:
        0.2s;

    }


    .form-group input:hover,
    .form-group select:hover {

      border-color:
        #b7cfd9;

    }


    .form-group input:focus,
    .form-group select:focus {

      border-color:
        #0780a7;

      box-shadow:
        0 0 0 3px
        rgba(7, 128, 167, 0.09);

    }


    .add-btn {

      width:
        100%;

      height:
        45px;

      border:
        0;

      border-radius:
        9px;

      background:
        linear-gradient(
          135deg,
          #0783aa,
          #086b91
        );

      color:
        white;

      font-size:
        13px;

      font-weight:
        bold;

      cursor:
        pointer;

      box-shadow:
        0 5px 13px
        rgba(7, 111, 145, 0.18);

      transition:
        0.2s;

    }


    .add-btn:hover {

      transform:
        translateY(-1px);

      box-shadow:
        0 7px 17px
        rgba(7, 111, 145, 0.25);

    }


    #message {

      min-height:
        20px;

      margin-top:
        12px;

      text-align:
        center;

      font-size:
        12px;

    }


    /* =====================================================
       SCHEDULE
    ===================================================== */

    .schedule-card {

      min-width:
        0;

    }


    .schedule-header {

      padding:
        18px 20px;

      border-bottom:
        1px solid #e8eff3;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      background:
        linear-gradient(
          180deg,
          #ffffff,
          #fbfdfe
        );

    }


    .schedule-header h3 {

      margin:
        0;

      color:
        #173a51;

      font-size:
        16px;

    }


    .schedule-header span {

      color:
        #718793;

      font-size:
        12px;

      background:
        #eef7fa;

      padding:
        6px 10px;

      border-radius:
        20px;

    }


    #appointments {

      padding:
        0 15px 15px;

    }


    /* =====================================================
       TIME SLOT
    ===================================================== */

    .time-slot {

      min-height:
        66px;

      display:
        grid;

      grid-template-columns:
        75px minmax(0, 1fr) auto;

      align-items:
        center;

      border-bottom:
        1px solid #edf2f5;

      transition:
        background 0.15s;

    }


    .time-slot:hover {

      background:
        #fbfdfe;

    }


    .time-slot:last-child {

      border-bottom:
        0;

    }


    .slot-time {

      color:
        #547082;

      font-size:
        13px;

      font-weight:
        bold;

    }


    .slot-content {

      display:
        flex;

      align-items:
        center;

      gap:
        15px;

      min-width:
        0;

    }


    .slot-content strong {

      color:
        #1d3c50;

      font-size:
        14px;

    }


    .slot-content small {

      color:
        #788d98;

      font-size:
        11px;

    }


    .status {

      padding:
        5px 10px;

      border-radius:
        20px;

      background:
        #edf6f8;

      color:
        #467387;

      font-size:
        11px;

      font-weight:
        bold;

      white-space:
        nowrap;

    }


    .appointment-actions {

      display:
        flex;

      gap:
        6px;

    }


    .appointment-actions button {

      border:
        1px solid #d3e0e6;

      background:
        white;

      color:
        #426274;

      border-radius:
        6px;

      padding:
        6px 9px;

      font-size:
        11px;

      cursor:
        pointer;

      transition:
        0.15s;

    }


    .appointment-actions button:hover {

      background:
        #eef7fa;

      border-color:
        #b8d2dd;

    }


    /* =====================================================
       EMPTY SLOT
    ===================================================== */

    .empty-slot {

      color:
        #9baab2;

    }


    .empty-slot .slot-content {

      cursor:
        pointer;

    }


    .empty-slot:hover {

      background:
        #f3fafc;

    }


    .empty-slot .slot-content span {

      color:
        #9aaab3;

      font-size:
        12px;

    }


    /* =====================================================
       ERROR
    ===================================================== */

    .error-box {

      margin:
        15px 0;

      padding:
        15px;

      border:
        1px solid #efcccc;

      background:
        #fff4f4;

      color:
        #a64242;

      border-radius:
        8px;

      font-size:
        13px;

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    .login-page {

      min-height:
        100vh;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        20px;

      background:
        linear-gradient(
          rgba(231, 244, 249, 0.82),
          rgba(245, 250, 252, 0.92)
        ),
        url("https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=2200&q=85");

      background-size:
        cover;

      background-position:
        center;

    }


    .login-box {

      width:
        100%;

      max-width:
        410px;

      background:
        rgba(255, 255, 255, 0.97);

      border:
        1px solid #dce7ed;

      border-radius:
        16px;

      padding:
        32px;

      box-shadow:
        0 15px 45px
        rgba(25, 70, 90, 0.16);

      backdrop-filter:
        blur(10px);

    }


    .login-box h2 {

      margin-top:
        0;

      margin-bottom:
        7px;

      text-align:
        center;

      color:
        #12384f;

    }


    .login-box p {

      text-align:
        center;

      color:
        #7c909b;

      font-size:
        13px;

      margin-bottom:
        22px;

    }


    .login-box input {

      width:
        100%;

      height:
        44px;

      margin-top:
        10px;

      padding:
        0 12px;

      border:
        1px solid #d5dfe6;

      border-radius:
        8px;

      outline:
        none;

      font-size:
        13px;

    }


    .login-box input:focus {

      border-color:
        #087ea4;

      box-shadow:
        0 0 0 3px
        rgba(8, 126, 164, 0.09);

    }


    .login-box button {

      width:
        100%;

      height:
        44px;

      margin-top:
        15px;

      border:
        0;

      border-radius:
        8px;

      background:
        linear-gradient(
          135deg,
          #087ea4,
          #075f82
        );

      color:
        white;

      cursor:
        pointer;

      font-weight:
        bold;

    }


    #loginMessage {

      margin-top:
        12px;

      text-align:
        center;

      color:
        #b74d4d;

      font-size:
        12px;

    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 1050px) {

      .main-grid {

        grid-template-columns:
          290px minmax(0, 1fr);

      }

      .slot-content {

        gap:
          10px;

      }

    }


    @media (max-width: 900px) {

      .main-grid {

        grid-template-columns:
          1fr;

      }

    }


    @media (max-width: 650px) {

      body {

        background-attachment:
          scroll;

      }


      .topbar {

        height:
          auto;

        min-height:
          68px;

        padding:
          12px 15px;

      }


      .brand-text h1 {

        font-size:
          16px;

      }


      .brand-text span {

        font-size:
          10px;

      }


      .brand-icon {

        width:
          40px;

        height:
          40px;

      }


      .top-status {

        display:
          none;

      }


      .page {

        padding:
          18px 12px 30px;

      }


      .page-title h2 {

        font-size:
          22px;

      }


      .date-panel {

        display:
          block;

      }


      .date-buttons {

        margin-top:
          13px;

        flex-wrap:
          wrap;

      }


      .date-buttons button {

        flex:
          1;

      }


      .time-slot {

        grid-template-columns:
          60px minmax(0, 1fr);

        padding:
          10px 0;

      }


      .appointment-actions {

        grid-column:
          2;

        margin-top:
          8px;

      }


      .slot-content {

        display:
          block;

      }


      .slot-content .status {

        display:
          inline-block;

        margin-top:
          5px;

      }


      .appointment-actions button {

        padding:
          7px 10px;

      }

    }

  </style>

</head>


<body>

    <div
      style="
        padding:50px;
        text-align:center;
        color:#71808d;
      "
    >
      Po ngarkohet...
    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="app.js"></script>

</body>

</html>
```
