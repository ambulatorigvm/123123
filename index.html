```html
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AMBULATORI GVM</title>

    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f4f8fb;
            color: #183b56;
            min-height: 100vh;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            color: #1976a8;
            font-size: 18px;
            font-weight: 600;
        }

        .loading::before {
            content: "✚";
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e3f4fb;
            color: #1685b5;
            font-size: 30px;
            font-weight: 800;
        }

        /* =========================
           LOGIN
        ========================= */

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background:
                radial-gradient(circle at top left, #dff5ff 0, transparent 35%),
                radial-gradient(circle at bottom right, #dceff8 0, transparent 35%),
                #f5f9fc;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(22, 80, 110, 0.12);
            border: 1px solid #e4eef4;
        }

        .medical-logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0e83b6, #22a6d5);
            color: white;
            font-size: 38px;
            font-weight: 800;
            box-shadow: 0 12px 25px rgba(14, 131, 182, 0.25);
        }

        .login-card h1 {
            text-align: center;
            color: #174a68;
            font-size: 27px;
            margin-bottom: 7px;
        }

        .login-subtitle {
            text-align: center;
            color: #78909c;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #35596e;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #d8e5ec;
            border-radius: 12px;
            padding: 13px 14px;
            outline: none;
            background: #fbfdfe;
            color: #173d53;
            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #20a0d0;
            box-shadow: 0 0 0 4px rgba(32, 160, 208, 0.10);
            background: white;
        }

        .login-button {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 14px;
            background: linear-gradient(135deg, #087fb4, #20a6d5);
            color: white;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 8px 20px rgba(8, 127, 180, 0.20);
        }

        .login-button:hover {
            transform: translateY(-1px);
        }

        /* =========================
           APP HEADER
        ========================= */

        .app-shell {
            min-height: 100vh;
        }

        .topbar {
            height: 76px;
            background: white;
            border-bottom: 1px solid #e2edf2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 3px 15px rgba(30, 80, 100, 0.05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: linear-gradient(135deg, #087fb4, #27a9d6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 800;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            color: #164a68;
            letter-spacing: 0.2px;
        }

        .brand-subtitle {
            font-size: 12px;
            color: #7c929e;
            margin-top: 2px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #55717f;
            font-size: 14px;
        }

        .user-avatar {
            width: 37px;
            height: 37px;
            border-radius: 50%;
            background: #e6f5fb;
            color: #087fb4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .logout-button {
            border: 1px solid #dbe8ee;
            background: white;
            color: #607d8b;
            border-radius: 10px;
            padding: 9px 13px;
            font-weight: 600;
        }

        .logout-button:hover {
            background: #f5f9fb;
            color: #d9534f;
        }

        /* =========================
           MAIN
        ========================= */

        .main-container {
            max-width: 1450px;
            margin: auto;
            padding: 28px 30px 45px;
        }

        .welcome-card {
            background: linear-gradient(135deg, #087fb4, #22a8d5);
            color: white;
            border-radius: 22px;
            padding: 25px 28px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 30px rgba(8, 127, 180, 0.16);
        }

        .welcome-card h2 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .welcome-card p {
            opacity: 0.88;
        }

        .doctor-icon {
            font-size: 50px;
            opacity: 0.9;
        }

        /* =========================
           DATE BAR
        ========================= */

        .date-card {
            background: white;
            border: 1px solid #e3edf2;
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 22px;
            box-shadow: 0 4px 18px rgba(40, 80, 100, 0.05);
        }

        .date-navigation {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .date-button {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            border: 1px solid #dbe8ee;
            background: #f8fbfd;
            color: #167ea9;
            font-size: 20px;
            font-weight: 700;
        }

        .date-button:hover {
            background: #e9f6fb;
        }

        .today-button {
            padding: 10px 15px;
            border-radius: 10px;
            border: none;
            background: #e7f5fb;
            color: #087fb4;
            font-weight: 700;
        }

        .current-date {
            text-align: center;
        }

        .current-date strong {
            display: block;
            color: #194d68;
            font-size: 20px;
        }

        .current-date span {
            color: #8a9ca5;
            font-size: 13px;
        }

        /* =========================
           DASHBOARD GRID
        ========================= */

        .dashboard-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 22px;
            align-items: start;
        }

        .panel {
            background: white;
            border: 1px solid #e3edf2;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(40, 80, 100, 0.05);
            overflow: hidden;
        }

        .panel-header {
            padding: 20px 21px;
            border-bottom: 1px solid #edf2f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #204f67;
            font-size: 17px;
            font-weight: 800;
        }

        .panel-title-icon {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            background: #e8f6fb;
            color: #087fb4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .panel-body {
            padding: 21px;
        }

        /* =========================
           APPOINTMENT FORM
        ========================= */

        .appointment-form textarea {
            min-height: 90px;
            resize: vertical;
        }

        .add-button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 13px;
            background: linear-gradient(135deg, #087fb4, #20a6d5);
            color: white;
            font-weight: 800;
            margin-top: 4px;
            box-shadow: 0 8px 18px rgba(8, 127, 180, 0.18);
        }

        .add-button:hover {
            transform: translateY(-1px);
        }

        /* =========================
           SCHEDULE
        ========================= */

        .schedule-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .schedule-count {
            background: #eaf6fb;
            color: #087fb4;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
        }

        .schedule-list {
            padding: 8px 12px 15px;
        }

        .appointment-row {
            display: grid;
            grid-template-columns: 90px 1fr auto;
            gap: 15px;
            align-items: center;
            padding: 13px 10px;
            border-bottom: 1px solid #edf2f5;
            transition: 0.15s;
        }

        .appointment-row:last-child {
            border-bottom: none;
        }

        .appointment-row:hover {
            background: #f8fbfd;
            border-radius: 10px;
        }

        .appointment-time {
            font-size: 16px;
            font-weight: 800;
            color: #087fb4;
        }

        .patient-info {
            min-width: 0;
        }

        .patient-name {
            font-size: 15px;
            font-weight: 800;
            color: #244e62;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .patient-phone {
            font-size: 12px;
            color: #8498a2;
            margin-top: 3px;
        }

        .patient-note {
            font-size: 12px;
            color: #6f848e;
            margin-top: 4px;
        }

        .appointment-actions {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .status-button {
            border: none;
            border-radius: 9px;
            padding: 7px 10px;
            font-size: 12px;
            font-weight: 800;
        }

        .status-planned {
            background: #e9f5fb;
            color: #087fb4;
        }

        .status-arrived {
            background: #fff3d8;
            color: #a16b00;
        }

        .status-finished {
            background: #e6f7ed;
            color: #218653;
        }

        .status-cancelled {
            background: #fdeaea;
            color: #c64d4d;
        }

        .delete-button {
            width: 32px;
            height: 32px;
            border: 1px solid #f0dddd;
            border-radius: 8px;
            background: #fffafa;
            color: #c85b5b;
            font-weight: 800;
        }

        .delete-button:hover {
            background: #fdeaea;
        }

        .empty-state {
            text-align: center;
            padding: 45px 20px;
            color: #8da0a9;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 10px;
            opacity: 0.65;
        }

        .empty-state strong {
            display: block;
            color: #637d89;
            margin-bottom: 5px;
        }

        /* =========================
           MESSAGES
        ========================= */

        .message {
            margin-bottom: 18px;
            padding: 12px 15px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 600;
        }

        .message.success {
            background: #e9f8ef;
            color: #22784c;
            border: 1px solid #cdebd9;
        }

        .message.error {
            background: #fff0f0;
            color: #b64646;
            border: 1px solid #f2d1d1;
        }

        .fatal-error {
            max-width: 650px;
            margin: 80px auto;
            background: white;
            border: 1px solid #f0d1d1;
            border-radius: 18px;
            padding: 30px;
            color: #a94444;
            box-shadow: 0 10px 35px rgba(80, 30, 30, 0.08);
        }

        .fatal-error h2 {
            margin-bottom: 10px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .welcome-card {
                padding: 22px;
            }
        }

        @media (max-width: 700px) {
            .topbar {
                height: auto;
                padding: 13px 16px;
                gap: 12px;
            }

            .user-info span {
                display: none;
            }

            .brand-title {
                font-size: 17px;
            }

            .brand-subtitle {
                display: none;
            }

            .main-container {
                padding: 18px 13px 35px;
            }

            .welcome-card {
                border-radius: 17px;
            }

            .welcome-card h2 {
                font-size: 20px;
            }

            .doctor-icon {
                font-size: 36px;
            }

            .date-card {
                flex-direction: column;
            }

            .date-navigation {
                width: 100%;
                justify-content: center;
            }

            .appointment-row {
                grid-template-columns: 65px 1fr;
                gap: 9px;
            }

            .appointment-actions {
                grid-column: 1 / -1;
                justify-content: flex-start;
            }

            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="loading">
            Po ngarkohet sistemi...
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app-gvm.js?v=GVM-20260924-08"></script>

</body>
</html>
