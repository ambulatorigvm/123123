```html
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AMBULATORI GVM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            color: #19323a;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(240, 248, 250, 0.92),
                    rgba(240, 248, 250, 0.96)
                ),
                url("https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=2000&q=80")
                center center / cover fixed;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           LOGIN
        ===================================================== */

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            padding: 38px;
            box-shadow:
                0 20px 60px rgba(30, 70, 80, 0.16);
            border: 1px solid #e2edef;
        }

        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        .login-logo-icon {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #178f7b;
            color: white;
            font-size: 34px;
            font-weight: 800;
            box-shadow:
                0 10px 25px rgba(23, 143, 123, 0.25);
        }

        .login-title {
            margin: 0;
            text-align: center;
            font-size: 26px;
            color: #17363d;
        }

        .login-subtitle {
            text-align: center;
            color: #71858b;
            margin-top: 8px;
            margin-bottom: 28px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .login-form label,
        .appointment-form label {
            display: block;
            margin-bottom: 7px;
            color: #35535a;
            font-size: 14px;
            font-weight: 700;
        }

        .login-form input,
        .appointment-form input,
        .appointment-form select {
            width: 100%;
            height: 46px;
            border: 1px solid #d6e4e8;
            border-radius: 11px;
            padding: 0 13px;
            background: white;
            color: #19323a;
            outline: none;
        }

        .login-form input:focus,
        .appointment-form input:focus,
        .appointment-form select:focus {
            border-color: #37a793;
            box-shadow:
                0 0 0 3px rgba(55, 167, 147, 0.10);
        }

        .login-error {
            padding: 11px 13px;
            border-radius: 10px;
            background: #fff0f0;
            border: 1px solid #efc5c5;
            color: #a63838;
            font-size: 14px;
        }

        .login-button,
        .primary-button {
            border: 0;
            border-radius: 11px;
            background: #178f7b;
            color: white;
            font-weight: 700;
            padding: 12px 20px;
            transition: 0.2s ease;
        }

        .login-button {
            width: 100%;
            height: 48px;
        }

        .login-button:hover,
        .primary-button:hover {
            background: #117967;
            transform: translateY(-1px);
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            min-height: 100vh;
            background:
                rgba(242, 249, 250, 0.90);
        }

        .top-header {
            min-height: 78px;
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid #dfeaec;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow:
                0 4px 18px rgba(30, 70, 80, 0.05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: #178f7b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
        }

        .brand-title {
            font-weight: 800;
            font-size: 17px;
            color: #17363d;
        }

        .brand-subtitle {
            color: #789096;
            font-size: 12px;
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .system-status {
            color: #21885d;
            background: #edf9f2;
            border: 1px solid #c8ead5;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .logout-button {
            border: 1px solid #d7e3e6;
            background: white;
            color: #526a71;
            border-radius: 10px;
            padding: 9px 14px;
            font-weight: 700;
        }

        .logout-button:hover {
            background: #f5f8f9;
        }

        .main-container {
            width: min(1250px, calc(100% - 30px));
            margin: 0 auto;
            padding: 25px 0 45px;
        }

        /* =====================================================
           DATE
        ===================================================== */

        .date-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .date-arrow {
            width: 42px;
            height: 42px;
            border: 1px solid #d8e5e8;
            border-radius: 12px;
            background: white;
            color: #45656d;
            font-size: 25px;
            line-height: 1;
        }

        .date-arrow:hover {
            background: #f2f8f9;
        }

        .selected-date {
            min-width: 280px;
            text-align: center;
            font-size: 19px;
            font-weight: 800;
            color: #23454d;
            text-transform: capitalize;
        }

        .today-button {
            border: 1px solid #cde4df;
            background: #eff9f6;
            color: #177d6d;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
        }

        /* =====================================================
           NEW APPOINTMENT
        ===================================================== */

        .new-appointment-card {
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid #dfeaec;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow:
                0 8px 25px rgba(30, 70, 80, 0.06);
        }

        .new-appointment-title {
            margin: 0 0 17px;
            font-size: 18px;
            color: #24464d;
        }

        .appointment-form {
            display: grid;
            grid-template-columns:
                150px
                minmax(200px, 1fr)
                minmax(180px, 0.8fr)
                auto;
            gap: 15px;
            align-items: end;
        }

        .primary-button {
            height: 46px;
            white-space: nowrap;
        }

        /* =====================================================
           SCHEDULE
        ===================================================== */

        .schedule-card {
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid #dfeaec;
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
                0 8px 25px rgba(30, 70, 80, 0.06);
        }

        .schedule-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5edef;
            background: #fbfdfd;
        }

        .schedule-header h2 {
            margin: 0;
            font-size: 18px;
            color: #24464d;
        }

        .schedule-table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
        }

        .schedule-row {
            border-bottom: 1px solid #edf2f3;
        }

        .schedule-row:last-child {
            border-bottom: 0;
        }

        .time-cell {
            width: 90px;
            min-width: 90px;
            padding: 14px 15px;
            text-align: center;
            vertical-align: middle;
            color: #587178;
            font-weight: 800;
            font-size: 14px;
            background: #fbfdfd;
            border-right: 1px solid #edf2f3;
        }

        .schedule-row > td:nth-child(2) {
            padding: 8px 10px;
        }

        .loading {
            padding: 35px;
            text-align: center;
            color: #71878d;
        }

        .empty-message {
            color: #9aa9ad;
            font-size: 13px;
        }

        /* =====================================================
           PATIENT CARD
        ===================================================== */

        .patient-card {
            min-height: 62px;
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        /* PLANIFIKUAR */
        .patient-card.planned {
            background: #eef6ff !important;
            border: 1px solid #bdd8f2 !important;
            border-left: 5px solid #3287d7 !important;
        }

        /* ERDHI */
        .patient-card.arrived {
            background: #eaf8ef !important;
            border: 1px solid #a9dfbd !important;
            border-left: 5px solid #27a269 !important;
            box-shadow:
                0 3px 12px rgba(39, 162, 105, 0.10);
        }

        /* PËRFUNDOI */
        .patient-card.finished {
            background: #eef8f3 !important;
            border: 1px solid #bfdfcf !important;
            border-left: 5px solid #21894f !important;
        }

        /* ANULUAR */
        .patient-card.cancelled {
            background: #fff0f0 !important;
            border: 1px solid #efc4c4 !important;
            border-left: 5px solid #c65353 !important;
            opacity: 0.90;
        }

        .patient-wrapper {
            min-width: 0;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .patient-avatar {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid rgba(70, 100, 110, 0.14);
            color: #31606b;
            font-weight: 800;
            font-size: 13px;
        }

        .patient-info {
            min-width: 0;
        }

        .patient-name {
            font-weight: 800;
            color: #24434a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .patient-label {
            color: #71858a;
            font-size: 12px;
            margin-top: 3px;
        }

        .status-cell {
            flex: 0 0 auto;
        }

        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 28px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-planned {
            background: #dceeff;
            color: #276ea9;
        }

        .status-arrived {
            background: #d5f2df;
            color: #19754b;
        }

        .status-finished {
            background: #dcefe5;
            color: #216d47;
        }

        .status-cancelled {
            background: #f9dcdc;
            color: #a33d3d;
        }

        .actions-cell {
            flex: 0 0 auto;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .action-button {
            border: 0;
            border-radius: 8px;
            padding: 7px 9px;
            font-size: 12px;
            font-weight: 700;
            color: white;
        }

        .action-button.arrived {
            background: #299b65;
        }

        .action-button.finished {
            background: #237e62;
        }

        .action-button.cancel {
            background: #c28a25;
        }

        .action-button.delete {
            background: #b95050;
        }

        .action-button:hover {
            filter: brightness(0.94);
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {
            .appointment-form {
                grid-template-columns: 1fr 1fr;
            }

            .appointment-form > div:last-child {
                grid-column: 1 / -1;
            }

            .patient-card {
                flex-wrap: wrap;
            }

            .actions-cell {
                width: 100%;
            }

            .action-buttons {
                justify-content: flex-start;
            }
        }

        @media (max-width: 650px) {
            .top-header {
                padding: 12px 15px;
                gap: 12px;
                align-items: flex-start;
            }

            .header-right {
                flex-direction: column;
                align-items: flex-end;
                gap: 7px;
            }

            .system-status {
                font-size: 11px;
                padding: 6px 9px;
            }

            .logout-button {
                padding: 7px 10px;
                font-size: 12px;
            }

            .main-container {
                width: calc(100% - 16px);
                padding-top: 15px;
            }

            .selected-date {
                min-width: 0;
                font-size: 15px;
                flex: 1;
            }

            .date-navigation {
                gap: 6px;
            }

            .date-arrow {
                width: 38px;
                height: 38px;
            }

            .today-button {
                padding: 8px 10px;
            }

            .appointment-form {
                grid-template-columns: 1fr;
            }

            .appointment-form > div:last-child {
                grid-column: auto;
            }

            .schedule-card {
                border-radius: 14px;
            }

            .time-cell {
                width: 70px;
                min-width: 70px;
                padding: 10px 7px;
                font-size: 12px;
            }

            .patient-card {
                padding: 9px;
            }

            .status-cell {
                order: 3;
            }

            .patient-wrapper {
                flex: 1 1 100%;
            }

            .actions-cell {
                flex: 1 1 100%;
            }

            .action-buttons {
                width: 100%;
            }

            .action-button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="loading">
            Po ngarkohet sistemi...
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js?v=GVM-20260924-01"></script>

</body>
</html>
