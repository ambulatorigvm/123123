```html
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AMBULATORI GVM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fa;
            color: #24343b;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #6d7c82;
        }

        /* LOGIN */

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f8fa;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #dfe9ec;
            box-shadow: 0 15px 40px rgba(30, 70, 80, 0.10);
        }

        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        .login-logo-icon {
            width: 58px;
            height: 58px;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1f8f8a;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .login-title {
            margin: 0;
            text-align: center;
            font-size: 25px;
        }

        .login-subtitle {
            margin: 8px 0 28px;
            text-align: center;
            color: #7b8a90;
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-form label,
        .appointment-form label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
            color: #45565d;
        }

        .login-form input,
        .appointment-form input,
        .appointment-form select {
            width: 100%;
            height: 45px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid #d5e1e5;
            outline: none;
            background: white;
        }

        .login-form input:focus,
        .appointment-form input:focus,
        .appointment-form select:focus {
            border-color: #1f8f8a;
        }

        .login-button {
            height: 45px;
            border: 0;
            border-radius: 10px;
            background: #1f8f8a;
            color: white;
            font-weight: bold;
        }

        .login-error {
            display: none;
            padding: 11px;
            border-radius: 9px;
            background: #fff1f1;
            border: 1px solid #efcccc;
            color: #b23d3d;
            font-size: 13px;
        }

        /* HEADER */

        .top-header {
            min-height: 76px;
            padding: 0 28px;
            background: white;
            border-bottom: 1px solid #e0eaed;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            border-radius: 13px;
            background: #1f8f8a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 21px;
        }

        .brand-title {
            font-size: 17px;
            font-weight: bold;
        }

        .brand-subtitle {
            margin-top: 3px;
            font-size: 12px;
            color: #7c8b91;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .system-status {
            padding: 8px 12px;
            border-radius: 20px;
            background: #edf9f2;
            color: #21824f;
            font-size: 12px;
            font-weight: bold;
        }

        .logout-button {
            border: 1px solid #dce6e9;
            background: white;
            color: #52636b;
            border-radius: 9px;
            padding: 9px 14px;
            font-weight: bold;
        }

        /* MAIN */

        .main-container {
            width: min(1250px, calc(100% - 30px));
            margin: 25px auto 50px;
        }

        .date-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .date-arrow {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid #dbe6e9;
            background: white;
            font-size: 24px;
        }

        .selected-date {
            min-width: 280px;
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            text-transform: capitalize;
        }

        .today-button {
            height: 40px;
            padding: 0 15px;
            border-radius: 10px;
            border: 1px solid #bfe0de;
            background: #eef9f8;
            color: #167975;
            font-weight: bold;
        }

        /* ADD APPOINTMENT */

        .new-appointment-card,
        .schedule-card {
            background: white;
            border: 1px solid #e0eaed;
            border-radius: 17px;
            box-shadow: 0 5px 20px rgba(35, 72, 82, 0.05);
        }

        .new-appointment-card {
            padding: 22px;
            margin-bottom: 20px;
        }

        .new-appointment-title {
            margin: 0 0 18px;
            font-size: 17px;
        }

        .appointment-form {
            display: grid;
            grid-template-columns: 160px 1fr 250px 150px;
            gap: 14px;
            align-items: end;
        }

        .primary-button {
            width: 100%;
            height: 45px;
            border: 0;
            border-radius: 10px;
            background: #1f8f8a;
            color: white;
            font-weight: bold;
        }

        /* SCHEDULE */

        .schedule-card {
            overflow: hidden;
        }

        .schedule-header {
            padding: 20px 22px;
            border-bottom: 1px solid #e5edef;
        }

        .schedule-header h2 {
            margin: 0;
            font-size: 17px;
        }

        .schedule-table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
        }

        .schedule-row {
            border-bottom: 1px solid #edf2f3;
        }

        .time-cell {
            width: 90px;
            padding: 13px 16px;
            color: #52656d;
            font-size: 13px;
            font-weight: bold;
            vertical-align: top;
            white-space: nowrap;
        }

        .schedule-row > td:nth-child(2) {
            padding: 7px 14px 7px 0;
        }

        .empty-message {
            color: #98a5aa;
            font-size: 13px;
        }

        /* PATIENT CARD */

        .patient-card {
            min-height: 64px;
            padding: 9px 12px;
            border-radius: 14px;

            display: grid;
            grid-template-columns: minmax(220px, 1fr) auto auto;
            align-items: center;
            gap: 14px;

            background: #f7fbfc;
            border: 1px solid #e1ecef;
        }

        /* PLANIFIKUAR */

        .patient-card.planned {
            background: #eef6ff;
            border: 1px solid #bdd8f2;
            border-left: 5px solid #3287d7;
        }

        /* ERDHI */

        .patient-card.arrived {
            background: #eaf8ef;
            border: 1px solid #a9dfbd;
            border-left: 5px solid #27a269;
        }

        /* PERFUNDOI */

        .patient-card.finished {
            background: #eef8f3;
            border: 1px solid #bfdfcf;
            border-left: 5px solid #21894f;
        }

        /* ANULUAR */

        .patient-card.cancelled {
            background: #fff0f0;
            border: 1px solid #efc4c4;
            border-left: 5px solid #c65353;
            opacity: 0.90;
        }

        .patient-wrapper {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .patient-avatar {
            width: 39px;
            height: 39px;
            flex: 0 0 auto;
            border-radius: 12px;
            background: rgba(255,255,255,0.75);
            border: 1px solid rgba(80,100,110,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #41555d;
            font-size: 12px;
            font-weight: bold;
        }

        .patient-info {
            min-width: 0;
        }

        .patient-name {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .patient-label {
            margin-top: 3px;
            color: #788990;
            font-size: 12px;
        }

        .status-cell {
            white-space: nowrap;
        }

        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 94px;
            padding: 7px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-planned {
            background: #dceeff;
            color: #286fae;
        }

        .status-arrived {
            background: #d8f2e2;
            color: #20784b;
        }

        .status-finished {
            background: #dcefe4;
            color: #216d42;
        }

        .status-cancelled {
            background: #ffe0e0;
            color: #b34d4d;
        }

        .actions-cell {
            white-space: nowrap;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .action-button {
            border: 1px solid #dce4e6;
            border-radius: 8px;
            padding: 7px 9px;
            font-size: 11px;
            font-weight: bold;
            background: white;
        }

        .action-button.arrived {
            color: #237d4e;
            border-color: #b7ddc6;
        }

        .action-button.finished {
            color: #226f45;
            border-color: #b9dbc8;
        }

        .action-button.cancel {
            color: #ad5555;
            border-color: #ecc4c4;
        }

        .action-button.delete {
            color: #68777d;
        }

        /* MOBILE */

        @media (max-width: 900px) {
            .appointment-form {
                grid-template-columns: 1fr 1fr;
            }

            .patient-card {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            .top-header {
                padding: 12px 15px;
            }

            .system-status {
                display: none;
            }

            .main-container {
                width: calc(100% - 20px);
                margin-top: 15px;
            }

            .appointment-form {
                grid-template-columns: 1fr;
            }

            .selected-date {
                min-width: 0;
                font-size: 16px;
            }

            .brand-subtitle {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="loading">
            Po ngarkohet sistemi...
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js?v=GVM-20260924-04"></script>

</body>
</html>
