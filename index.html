<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMBULATORI GVM - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#eef3f8;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.login-box{
    width:100%;
    max-width:400px;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#155e75;
    margin-bottom:20px;
}

input{
    width:100%;
    height:45px;
    padding:10px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    height:45px;
    border:none;
    border-radius:8px;
    background:#0891b2;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0e7490;
}

#msg{
    margin-top:10px;
    text-align:center;
    color:red;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>AMBULATORI GVM</h1>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Fjalëkalimi"
    >

    <button onclick="login()">
        Hyr
    </button>

    <div id="msg"></div>

</div>

<script>

const SUPABASE_URL =
"https://ubpteaqdkxcriqyaxrux.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dirq3uo9Qy1ez37JkEnciA_sSmYleDZ";

const sb =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const msg =
        document.getElementById("msg");

    msg.textContent = "";

    const { data, error } =
        await sb.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        msg.textContent =
            error.message;

        console.error(error);

        return;
    }

    console.log("Login OK", data);

    window.location.href =
        "dashboard.html";
}

</script>

</body>
</html>
