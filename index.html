```html
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AMBULATORI GVM</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .payment-options {
            margin-top: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f8f8;
        }

        .payment-options label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-right: 20px;
            cursor: pointer;
        }

        .payment-options input {
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AMBULATORI GVM</h1>

    <div id="systemStatus">
        Po ngarkohet sistemi...
    </div>

    <div class="date-navigation">

        <button id="prevDay" type="button">
            ◀ Dita paraardhëse
        </button>

        <div id="currentDate"></div>

        <button id="today" type="button">
            Sot
        </button>

        <button id="nextDay" type="button">
            Dita tjetër ▶
        </button>

    </div>

    <form id="appointmentForm">

        <div class="form-group">

            <label for="patientName">
                Emër Mbiemër
            </label>

            <input
                type="text"
                id="patientName"
                name="patientName"
                required
                autocomplete="off"
            >

        </div>

        <div class="form-group">

            <label>
                Lloji i vizitës
            </label>

            <div class="visit-type">

                <label>
                    <input
                        type="radio"
                        name="visitType"
                        value="Vizitë"
                        checked
                    >
                    Vizitë
                </label>

                <label>
                    <input
                        type="radio"
                        name="visitType"
                        value="Rikontroll"
                    >
                    Rikontroll
                </label>

            </div>

        </div>

        <!-- OPSIONET E PAGESËS -->
        <div
            id="paymentOptions"
            class="payment-options"
            style="display: none;"
        >

            <strong>Pagesa:</strong>

            <label>
                <input
                    type="checkbox"
                    id="paidCheck"
                    name="payment"
                    value="paid"
                >
                Me pagesë
            </label>

            <label>
                <input
                    type="checkbox"
                    id="unpaidCheck"
                    name="payment"
                    value="unpaid"
                >
                Pa pagesë
            </label>

        </div>

        <div class="form-group">

            <label for="cardNumber">
                Nr. i kartelës
            </label>

            <input
                type="text"
                id="cardNumber"
                name="cardNumber"
                autocomplete="off"
            >

        </div>

        <div class="form-group">

            <label for="appointmentTime">
                Ora
            </label>

            <select
                id="appointmentTime"
                name="appointmentTime"
                required
            >
                <option value="">
                    Zgjidh orën
                </option>
            </select>

        </div>

        <button
            type="submit"
            id="saveAppointment"
        >
            Ruaj vizitën
        </button>

    </form>

    <hr>

    <h2>
        Vizitat e ditës
    </h2>

    <div id="appointments">
        Po ngarkohen vizitat...
    </div>

</div>

<script src="app.js?v=20260926-01"></script>

</body>
</html>
```
